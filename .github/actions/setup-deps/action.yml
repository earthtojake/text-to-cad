name: Set up dependencies
description: Install the selected root npm workspaces and optional Python/browser dependencies.

inputs:
  python:
    description: Install requirements-dev.txt.
    default: "true"
  playwright:
    description: Install Python Playwright's snapshot browser (requires python).
    default: "true"
  ui-browser:
    description: >-
      Install the npm Playwright Chromium used by the shared UI, web and desktop browser
      tests: "true" for the full browser, "shell" for only the headless shell (enough
      when every browser test the job runs launches headless), "false" for none.
    default: "false"
  npm:
    description: Space-separated root workspace paths, or "none". Include shared dependencies used by the job.
    default: "packages/core packages/ui apps/web apps/docs"

runs:
  using: composite
  steps:
    - name: Set up Python
      if: inputs.python == 'true'
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-dev.txt

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install Python dependencies
      if: inputs.python == 'true'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Install the snapshot browser
      if: inputs.python == 'true' && inputs.playwright == 'true'
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          python -m playwright install --with-deps chromium
        else
          python -m playwright install chromium
        fi

    - name: Install selected root workspaces
      if: inputs.npm != 'none'
      shell: bash
      env:
        NPM_WORKSPACES: ${{ inputs.npm }}
      run: |
        args=()
        for workspace in $NPM_WORKSPACES; do
          args+=(--workspace "$workspace")
        done
        npm ci "${args[@]}"
        case " $NPM_WORKSPACES " in
          *" packages/core "*) npm run build --workspace @text-to-cad/core ;;
        esac
        case " $NPM_WORKSPACES " in
          *" packages/ui "*) npm run build --workspace @text-to-cad/ui ;;
        esac

    # The browser download is the uncached part of this step (6.4 s for the headless
    # shell, measured). macOS only: its cache directory is a fixed, known path, and the
    # Linux jobs also install system packages the cache cannot hold. The install below
    # still runs on a hit; with the revision present it downloads nothing, so a stale or
    # partial restore is repaired rather than trusted.
    - name: Read the npm Playwright version
      id: playwright-version
      if: runner.os == 'macOS' && (inputs.ui-browser == 'true' || inputs.ui-browser == 'shell')
      shell: bash
      run: |
        echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

    - name: Restore the npm Playwright browser
      if: runner.os == 'macOS' && (inputs.ui-browser == 'true' || inputs.ui-browser == 'shell')
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright-version.outputs.version }}-${{ inputs.ui-browser }}

    # npm and Python Playwright can require different Chromium revisions.
    - name: Install shared UI and web test browser
      if: inputs.ui-browser == 'true' || inputs.ui-browser == 'shell'
      shell: bash
      env:
        UI_BROWSER: ${{ inputs.ui-browser }}
      run: |
        args=(chromium)
        if [ "$UI_BROWSER" = "shell" ]; then args+=(--only-shell); fi
        if [ "$RUNNER_OS" = "Linux" ]; then args+=(--with-deps); fi
        npx --no-install playwright install "${args[@]}"
