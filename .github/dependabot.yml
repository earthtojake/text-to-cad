# Weekly dependency PRs, one grouped PR per ecosystem for minor + patch bumps so the
# noise is one review, not twenty. Majors stay individual. Every PR carries the
# `dependencies` label, which .github/release.yml files under Maintenance.
#
# packages/cadgen's pins are the Python floor a released wheel is built against, so
# they are reviewed like any other change; cadgen-js/viewer/docs are the three npm
# trees CI installs (.github/actions/setup-deps).
version: 2
updates:
  # `/` covers .github/workflows plus a root action.yml -- it does NOT reach a
  # composite action nested under .github/actions, which is why setup-deps sat on
  # setup-node@v4 and setup-python@v5 while every workflow moved to v7. That file
  # is where all of CI gets its Python and Node, so it is the last place that
  # should rot unwatched. The second entry names it directly.
  #
  # UNVERIFIED: GitHub documents `/` for this ecosystem and does not document the
  # nested-composite case. If no PR ever arrives for setup-deps, this entry is
  # inert and the pins there need bumping by hand -- check it against the
  # workflow pins when a setup-node/setup-python major lands.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-deps
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      setup-deps-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/viewer
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      viewer-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /packages/cadgen-js
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cadgen-js-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      docs-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /packages/cadgen
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cadgen-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Two ceilings are raised by hand, and a bot cannot tell that it has raised
    # them: both are satisfied by the version already installed, so widening
    # them changes nothing that CI can run and everything about what a LATER
    # install resolves.
    #
    # cadquery-ocp-novtk is the geometry kernel. OCCT 7.8 -> 7.9 re-hashed ~20k
    # STEP lines in one downstream part with no design change, so a major is a
    # geometry event, not a dependency event. It is also invisible to CI while
    # build123d's own `<8.0` caps the resolver: a widening PR passes every job
    # without OCP 8 ever being installed, then takes effect silently the day
    # build123d widens too.
    #
    # build123d is capped for the reason pyproject.toml gives at length -- cadgen
    # replaces its op memo, its topology entry points and `Compound.__init__`,
    # and a release that moves those stops applying the patch rather than
    # failing. 0.11 -> 0.12 is a semver MINOR, so without this it would arrive
    # inside the grouped minor/patch PR above.
    #
    # Raise either ceiling in its own PR, after running the suite against it.
    ignore:
      - dependency-name: cadquery-ocp-novtk
        update-types:
          - version-update:semver-major
      - dependency-name: build123d
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
