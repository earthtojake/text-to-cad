# Weekly dependency PRs, one grouped PR per ecosystem for minor + patch bumps so the
# noise is one review, not twenty. Majors stay individual. Every PR carries the
# `dependencies` label, which .github/release.yml files under Maintenance.
#
# packages/cadgen's pins are the Python floor a released wheel is built against, so
# they are reviewed like any other change; @hardcore/core/viewer/docs are the three npm
# trees CI installs (.github/actions/setup-deps).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /packages/cadgen
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cadgen-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
