name: Release

# One button: bump VERSION on main through a release PR, then publish the cadgen
# wheel to PyPI, deploy the docs site, and tag + GitHub-Release the SAME commit.
#
# main is the source branch. There is no publish tree, no transformed commit and
# no second branch: what a release publishes is the merged release commit on
# main, and the tag points at it. Skill requirements are pinned to VERSION on
# main itself (the release PR stamps them, scripts/release/check-version.sh
# asserts them), so an installer that clones main at any commit gets a skill
# whose pin names a cadgen that exists on PyPI.
#
# bump=none republishes main as it stands: the resume path when a previous run
# uploaded the wheel (skip-existing makes that a no-op) but failed before the
# tag, or when the docs deploy needs rerunning for the current version.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver part to bump when set_version is empty. Use none to republish main as it stands (the resume path).
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      set_version:
        description: Exact X.Y.Z version to release instead of bumping. Leave empty unless you are naming a specific new version.
        required: false
        type: string
      dry_run:
        description: Show the release version changes without opening a PR, merging, or publishing.
        required: true
        default: false
        type: boolean
      publish:
        description: Publish the GitHub Release. Set to false to leave it as a draft.
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.release_sha.outputs.sha }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure release credentials
        env:
          RELEASE_ORCHESTRATOR_TOKEN: ${{ secrets.RELEASE_ORCHESTRATOR_TOKEN }}
          PREPARE_RELEASE_TOKEN: ${{ secrets.PREPARE_RELEASE_TOKEN }}
          PUBLISH_PUSH_TOKEN: ${{ secrets.PUBLISH_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          release_token="${RELEASE_ORCHESTRATOR_TOKEN:-${PREPARE_RELEASE_TOKEN:-${PUBLISH_PUSH_TOKEN:-$GITHUB_TOKEN}}}"
          if [ -n "${RELEASE_ORCHESTRATOR_TOKEN:-}" ]; then
            echo "Using RELEASE_ORCHESTRATOR_TOKEN for release orchestration."
          elif [ -n "${PREPARE_RELEASE_TOKEN:-}" ]; then
            echo "Using PREPARE_RELEASE_TOKEN for release orchestration."
          elif [ -n "${PUBLISH_PUSH_TOKEN:-}" ]; then
            echo "Using PUBLISH_PUSH_TOKEN for release orchestration."
          else
            echo "Using GITHUB_TOKEN for release orchestration."
          fi

          git remote set-url origin "https://x-access-token:${release_token}@github.com/${GITHUB_REPOSITORY}.git"
          {
            echo "GH_TOKEN=$release_token"
            echo "RELEASE_TOKEN=$release_token"
          } >> "$GITHUB_ENV"

      # Release preparation is three stamps from one number: VERSION itself, the
      # derived package/plugin metadata (sync-version.mjs), and every skill's
      # cadgen pin (pin-cadgen-requirements.sh). All three land in the release
      # PR, so main never carries a version whose pins or metadata disagree with it.
      - name: Prepare canonical version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          SET_VERSION: ${{ inputs.set_version }}
        run: |
          # bump=none publishes main as it stands. sync-version and the pin still
          # run, so a main whose derived metadata or pins have drifted from VERSION
          # shows up as changed=true and goes through a release PR rather than
          # publishing the drift.
          if [ "$BUMP" = "none" ] && [ -z "$SET_VERSION" ]; then
            echo "No version change requested; publishing main as it stands."
          elif [ -n "$SET_VERSION" ]; then
            scripts/release/bump-version.sh --set-version "$SET_VERSION" --no-commit
          else
            scripts/release/bump-version.sh "$BUMP" --no-commit
          fi
          node scripts/release/sync-version.mjs
          scripts/release/pin-cadgen-requirements.sh
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main already carries release version $version with current metadata and pins; skipping the release PR."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Prepared release version: $version"
          fi

      - name: Check release version metadata
        env:
          CHANGED: ${{ steps.version.outputs.changed }}
        run: |
          # check-version.sh covers VERSION's shape AND every skill pin equalling it.
          node scripts/release/sync-version.mjs --check
          if [ "$CHANGED" = "true" ]; then
            latest_tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1 || true)"
            if [ -n "$latest_tag" ]; then
              scripts/release/check-version.sh --incremented-from "refs/tags/$latest_tag"
            else
              scripts/release/check-version.sh
            fi
          else
            scripts/release/check-version.sh
            echo "No version metadata changes; the publish gate decides whether this version still needs to ship."
          fi

      - name: Show dry-run diff
        if: inputs.dry_run
        run: |
          git diff --stat
          git diff -- VERSION

      - name: Stop after dry run
        if: inputs.dry_run
        run: echo "Dry run requested; skipping release branch, PR merge, and publish."

      - name: Create or update release pull request
        if: ${{ !inputs.dry_run && steps.version.outputs.changed == 'true' }}
        id: release_pr
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/$VERSION"
          body="Bumps VERSION, derived package/plugin metadata and every skill's cadgen pin to $VERSION. Created by the one-button Release workflow, which merges it into main immediately; the publish job revalidates the tree before the wheel ships."

          git checkout -B "$branch"
          git add -A
          git commit -m "Release $VERSION"
          git push --force-with-lease origin "$branch"

          if pr_json="$(gh pr view "$branch" --repo "$GITHUB_REPOSITORY" --json number,url 2>/dev/null)"; then
            pr_number="$(printf '%s\n' "$pr_json" | jq -r '.number')"
            pr_url="$(printf '%s\n' "$pr_json" | jq -r '.url')"
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --title "Release $VERSION" \
              --body "$body"
          else
            pr_url="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Release $VERSION" \
              --body "$body")"
            pr_number="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json number --jq '.number')"
          fi

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Release PR: $pr_url"

      - name: Merge release pull request
        if: ${{ !inputs.dry_run && steps.release_pr.outputs.created == 'true' }}
        env:
          PR_NUMBER: ${{ steps.release_pr.outputs.number }}
        run: |
          pr_json="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid)"
          head_sha="$(printf '%s\n' "$pr_json" | jq -r '.headRefOid')"
          merged=false
          for attempt in $(seq 1 6); do
            if gh api \
              --method PUT \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
              -f merge_method=merge \
              -f sha="$head_sha"; then
              merged=true
              break
            fi
            echo "Merge attempt $attempt failed; retrying while GitHub computes mergeability..."
            sleep 10
          done
          if [ "$merged" != "true" ]; then
            echo "Could not merge release PR #$PR_NUMBER." >&2
            exit 1
          fi

      # The commit every later job builds, deploys and tags. One SHA: the merged
      # release commit on main (or main's head when nothing changed).
      - name: Resolve release commit
        if: ${{ !inputs.dry_run }}
        id: release_sha
        run: |
          git fetch --no-tags origin "+main:refs/remotes/origin/main"
          release_sha="$(git rev-parse "origin/main^{commit}")"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Releasing main at $release_sha."

  publish:
    name: Publish
    needs: release-pr
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing (OIDC) for the PyPI upload.
      id-token: write
    outputs:
      published: ${{ steps.publish_done.outputs.published }}
      release_sha: ${{ needs.release-pr.outputs.release_sha }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-pr.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check canonical release version
        run: scripts/release/check-version.sh

      # Publish only when the version is new: past the latest tag, or equal to it
      # with the tag missing (a run that uploaded the wheel and died before
      # tagging -- bump=none resumes it; skip-existing makes the re-upload a no-op).
      - name: Evaluate release gate
        id: gate
        run: |
          current_version="$(tr -d '[:space:]' < VERSION)"
          latest_tag="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1 || true)"
          if [ -z "$latest_tag" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "No release tag yet; publishing $current_version."
            exit 0
          fi
          if scripts/release/check-version.sh --incremented-from "refs/tags/$latest_tag" >/tmp/publish-tag-version-check.log 2>&1; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Release version $current_version advanced past $latest_tag; publishing."
            exit 0
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$current_version" >/dev/null; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version $current_version has no tag yet; resuming publish."
            exit 0
          fi
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
          echo "Skipping publish: version $current_version is already tagged."

      - name: Skip non-release publish
        if: steps.gate.outputs.should_publish != 'true'
        run: echo "Nothing to publish; main's version is already released."

      - name: Set up dependencies
        if: steps.gate.outputs.should_publish == 'true'
        uses: ./.github/actions/setup-deps

      # The bundle feeds the WHEEL: cadgen's Node builders and snapshot bundle
      # (committed, so --clean must reproduce them byte for byte) and the CAD
      # Viewer client (gitignored, wheel-only). Nothing here writes to git.
      - name: Bundle production outputs
        if: steps.gate.outputs.should_publish == 'true'
        run: scripts/bundle/bundle.sh --clean

      - name: Validate production bundle layout
        if: steps.gate.outputs.should_publish == 'true'
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      - name: Run documentation checks
        if: steps.gate.outputs.should_publish == 'true'
        run: scripts/test/test-docs.sh

      - name: Run code tests
        if: steps.gate.outputs.should_publish == 'true'
        run: scripts/test/test.sh

      - name: Check cadgen package version matches the canonical release version
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! grep -Eq "^version = \"$version\"$" packages/cadgen/pyproject.toml; then
            echo "packages/cadgen/pyproject.toml version does not match VERSION ($version)." >&2
            exit 1
          fi

      # Package data fails quietly: a glob that stops matching produces a wheel
      # that imports fine and cannot build a DXF preview or serve the Viewer.
      - name: Check cadgen wheel contents
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      - name: Build cadgen sdist and wheel
        if: steps.gate.outputs.should_publish == 'true'
        run: |
          python3 -m pip install --upgrade build
          python3 -m build packages/cadgen

      # Uploaded BEFORE the tag: the skill pins on main name this version, so a
      # tagged release without its wheel would break every skill install. If the
      # upload succeeds and a later step fails, rerun with bump=none.
      - name: Publish cadgen to PyPI
        if: steps.gate.outputs.should_publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cadgen/dist
          skip-existing: true

      - name: Record publish
        if: steps.gate.outputs.should_publish == 'true'
        id: publish_done
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  # The docs site is built from the release commit itself: main is the source
  # tree, and apps/docs/package.json carries the stamped version the header reads.
  deploy-docs:
    name: Deploy Docs
    needs:
      - release-pr
      - publish
    if: ${{ needs.publish.outputs.published == 'true' }}
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.release-pr.outputs.release_sha }}
    secrets: inherit

  tag-release:
    name: Tag and GitHub Release
    needs:
      - release-pr
      - publish
      - deploy-docs
    if: ${{ needs.publish.outputs.published == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-pr.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure tag push credentials
        env:
          PUBLISH_PUSH_TOKEN: ${{ secrets.PUBLISH_PUSH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PUBLISH_PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUBLISH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using PUBLISH_PUSH_TOKEN for tag push."
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using GITHUB_TOKEN for tag push."
          fi

      - name: Create release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--target HEAD)
          if [ "$INPUT_PUBLISH" = "true" ]; then
            args+=(--publish)
          fi
          scripts/release/publish-github-release.sh "${args[@]}"
