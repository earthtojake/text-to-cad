# One job per concern. What a change can break decides what runs:
# scripts/github-workflows/select_checks.py maps every changed path through an explicit
# table of the tests that read it, and each job below runs on its own flag. Skill prose
# runs the tests that read that prose; a cadgen module runs cadgen's suites and the hosts
# that load it; a test file runs itself. A path the table does not know runs everything,
# and so does a manual run or a VERSION change -- a release is tested whole.
#
# Every run records the tree it tested (an artifact named tested-<tree>-<scope>). A push
# whose tree its pull request already tested with the same selection runs nothing again,
# and Publish Release ships a release commit without re-testing it when a run here tested
# its tree in full (scripts/github-workflows/tested_tree.py). Publish Release also calls
# this workflow with `full` when it finds no such run.
#
# Check names are the jobs' concerns: `core-js` tests packages/core, `web` tests
# packages/ui and apps/web and drives the bundled viewer, `mcp` tests apps/mcp, `api` tests
# apps/api. main requires Version Check, cadgen (Linux), cadgen (Windows), core-js, web,
# skills, docs and packaging; not `mcp` or `api`.
name: Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever changed.
        type: boolean
        default: false
      ref:
        description: The commit to test; the caller's commit when empty.
        type: string
        default: ""
  pull_request:
    branches:
      - main
      - build-test
  push:
    branches:
      - main
      - build-test

# github.workflow is the CALLER's name when Publish Release calls this, so its run never
# queues behind -- or cancels -- this workflow's own runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each job's timeout is about twice its slowest recent run. A job that runs Python
  # test files also leaves room for unittest_files.py's per-file hang guard (15 min)
  # to fire first and name the file. A hang fails in minutes, not at GitHub's
  # six-hour default.
  #
  # What the change can break, as flags and test paths. Every other job reads these.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # A push looks up the run that already tested its tree (tested_tree.py).
      actions: read
    outputs:
      cadgen: ${{ steps.select.outputs.cadgen }}
      cadgen_tests: ${{ steps.select.outputs.cadgen_tests }}
      core_js: ${{ steps.select.outputs.core_js }}
      web: ${{ steps.select.outputs.web }}
      web_ui: ${{ steps.select.outputs.web_ui }}
      web_client: ${{ steps.select.outputs.web_client }}
      web_viewer: ${{ steps.select.outputs.web_viewer }}
      mcp: ${{ steps.select.outputs.mcp }}
      api: ${{ steps.select.outputs.api }}
      skills: ${{ steps.select.outputs.skills }}
      light_policy: ${{ steps.select.outputs.light_policy }}
      light_tests: ${{ steps.select.outputs.light_tests }}
      skills_policy: ${{ steps.select.outputs.skills_policy }}
      skills_tests: ${{ steps.select.outputs.skills_tests }}
      skills_runtime: ${{ steps.select.outputs.skills_runtime }}
      docs: ${{ steps.select.outputs.docs }}
      packaging: ${{ steps.select.outputs.packaging }}
      kicad: ${{ steps.select.outputs.kicad }}
      harness: ${{ steps.select.outputs.harness }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The commit and its parents: a pull request's merge commit is diffed against its
          # first parent, the target branch as it is now; a push fetches `before` itself.
          fetch-depth: 2
          persist-credentials: false

      - name: Select what this change can break
        id: select
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || inputs.full }}
          # Only a push diffs against `before`; a pull request's synchronize event carries one too.
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github-workflows/select_checks.py

      # A record only saves running the tests again, so failing to upload one fails nothing: the
      # tests still run here, and the push and Publish Release, finding no record, test again.
      - name: Record the tree this run tests
        if: steps.select.outputs.record != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.select.outputs.record }}
          path: ${{ runner.temp }}/selection.json
          retention-days: 90
          overwrite: true

  # Every change, selected or not: the canonical version, the derived metadata and the
  # cadgen pins, and the tracked tree's rules -- and on a pull request, what merging it
  # releases. A pull request that changes VERSION is a release: merging it starts Publish
  # Release. Only a branch of this repository may carry one, and only to a version past the
  # target branch's and the latest tag (scripts/release/check-pr-version.sh).
  version:
    name: Version Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The release guard reads the target branch's history and the release tags.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check release version
        run: |
          scripts/release/check-version.sh
          node scripts/release/sync-version.mjs --check

      - name: Check what merging releases
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: scripts/release/check-pr-version.sh "$HEAD_REPO" | tee -a "$GITHUB_STEP_SUMMARY"

      # The shipping contract's tree rules hold for every change, docs and models
      # included, and need no runtime: no symlink, no LFS or other rewriting
      # .gitattributes rule, every file under 5 MiB, no skill reaching into a repo root.
      - name: Check the tracked tree
        run: scripts/github-workflows/check-builds.sh --tree-only

  # The cadgen package suite, CAD Viewer backend included, on both platforms -- or the
  # files of it a change selected (a test edited, a document a test reads).
  cadgen-linux:
    name: cadgen (Linux)
    needs: changes
    if: needs.changes.outputs.cadgen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Test files at a time: each is a kernel-loading interpreter (~450 MB).
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      - name: Run the cadgen package suite
        env:
          TESTS: ${{ needs.changes.outputs.cadgen_tests }}
        run: |
          # TESTS is a space-separated list of repo paths: split on purpose.
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --select cadgen --print-weights $TESTS

  # Why Windows runs at all: four of the last five user-reported bugs were Windows-only
  # (#260, #266, #267, #269) and every one passed CI -- the coverage existed, the runner
  # did not. The platform risk is file I/O: locks, paths, subprocesses, file URLs, the
  # daemon, the viewer backend. That is this suite, and only this suite.
  cadgen-windows:
    name: cadgen (Windows)
    needs: changes
    if: needs.changes.outputs.cadgen == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Four, the core count. Six was measured: every file slowed by ~40% and the
      # run failed on timeouts -- the spawn-bound tail is not idle CPU to fill.
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      # --keep-going: report every failing suite in one round trip rather than one per
      # run; the Linux job keeps the fail-fast default.
      - name: Run the cadgen package suite
        env:
          TESTS: ${{ needs.changes.outputs.cadgen_tests }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --keep-going --select cadgen --print-weights $TESTS
        shell: bash

  core-js:
    name: core-js
    needs: changes
    if: needs.changes.outputs.core_js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core

      - name: Run shared core tests
        run: scripts/test/test-js.sh --select core


  # The client is platform-agnostic JS, so Linux only. The viewer steps serve the bundled
  # client through the real backend and draw it in Playwright's Chromium, which is why a
  # cadgen change runs them too, and why this job installs Python only for them.
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          # The launch smoke test drives Python Playwright's Chromium; the browser gates and
          # the UI specs drive npm Playwright's.
          python: ${{ needs.changes.outputs.web_viewer }}
          playwright: ${{ needs.changes.outputs.web_viewer }}
          npm: packages/core packages/ui apps/web apps/mcp
          ui-browser: "true"

      - name: Run shared UI tests
        if: needs.changes.outputs.web_ui == 'true'
        # One browser spec at a time: each renders WebGL in software here (SwiftShader), and
        # several at once saturate the runner's four cores until clicks time out.
        env:
          UI_BROWSER_TEST_CONCURRENCY: "1"
        run: scripts/test/test-js.sh --select ui

      - name: Run the CAD Viewer client tests
        if: needs.changes.outputs.web_client == 'true'
        run: scripts/test/test-js.sh --select web

      - name: Bundle production outputs
        if: needs.changes.outputs.web_viewer == 'true'
        run: scripts/bundle/bundle.sh

      - name: Launch the bundled CAD Viewer through the backend
        if: needs.changes.outputs.web_viewer == 'true'
        run: scripts/test/test-viewer-launch.sh

      - name: Exercise the bundled viewer in Chromium
        if: needs.changes.outputs.web_viewer == 'true'
        env:
          VIEWER_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/viewer-browser
        run: scripts/test/test-viewer-browser.sh

      - name: Upload failed viewer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-browser-diagnostics
          path: ${{ runner.temp }}/viewer-browser
          if-no-files-found: ignore
          retention-days: 3

  # The CAD app an agent host renders: its host adapter's units in jsdom, and the one-file
  # build it ships as (a build that would leave anything outside index.html fails).
  mcp:
    name: mcp
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          npm: packages/core packages/ui apps/mcp

      - name: Run the CAD app tests and build it
        run: scripts/test/test-js.sh --select mcp

  # Boards (@pcb, cadgen.kicad) end to end through a real KiCad 10: its kicad-cli fills,
  # checks, plots and exports every board these tests build, and the simulation tests
  # load the ngspice library KiCad depends on. Linux only: what can break here is
  # cadgen's use of KiCad, and KiCad's command line is the same on every platform. The
  # PPA's kicad package is the command line and its symbol and footprint libraries;
  # the 3D model library (over a gigabyte) is left out, so boards export bare.
  # board.autoroute() runs Freerouting, a separate program cadgen never ships (GPL-3.0):
  # the pinned release's jar, checked against its published SHA-256, on Java 25.
  kicad:
    name: KiCad boards
    needs: changes
    if: needs.changes.outputs.kicad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FREEROUTING_VERSION: "2.4.1"
      FREEROUTING_SHA256: "251101c3eeac22d7e7dfcf6796603279e5d1000283eb82d8f093780f7afc6aa9"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install KiCad 10
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends kicad kicad-symbols kicad-footprints libngspice0
          kicad-cli version

      - name: Set up Java 25 for Freerouting
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          java-package: jre

      - name: Cache Freerouting
        id: freerouting
        uses: actions/cache@v6
        with:
          path: ~/.cache/freerouting
          key: freerouting-${{ env.FREEROUTING_VERSION }}-${{ env.FREEROUTING_SHA256 }}

      - name: Download Freerouting
        if: steps.freerouting.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/freerouting"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$HOME/.cache/freerouting/freerouting-${FREEROUTING_VERSION}.jar" \
            "https://github.com/freerouting/freerouting/releases/download/v${FREEROUTING_VERSION}/freerouting-${FREEROUTING_VERSION}.jar"

      - name: Point cadgen at Freerouting
        run: |
          jar="$HOME/.cache/freerouting/freerouting-${FREEROUTING_VERSION}.jar"
          echo "${FREEROUTING_SHA256}  ${jar}" | sha256sum --check
          echo "CADGEN_FREEROUTING=${jar}" >> "$GITHUB_ENV"

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      - name: Run the KiCad suites
        run: scripts/test/test-kicad.sh

  # Wiring harnesses (@harness, cadgen.wireviz) end to end through a real WireViz: it
  # draws every document these tests write and lists its bill of materials. WireViz is a
  # separate program cadgen runs and never imports (GPL-3.0), installed here only for the
  # tests to find on PATH; Graphviz's dot is what it draws with. Linux only: what can
  # break is cadgen's use of WireViz, whose command line is the same on every platform.
  # Boards come from the tests' own tiny library, so no KiCad.
  harness:
    name: WireViz harnesses
    needs: changes
    if: needs.changes.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends graphviz
          dot -V

      # The snapshot browser too: a harness snapshot is drawn by the CAD Viewer's plot scene.
      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      # Pinned: a WireViz release that changes its syntax should fail here on purpose, the
      # day it is adopted, not on whichever day it ships.
      - name: Install WireViz
        run: |
          python -m pip install "wireviz==0.4.1"
          wireviz --version

      - name: Run the WireViz suites
        run: scripts/test/test-harness.sh

  # api.texttocad.dev (apps/api): the version feed's and the telemetry receiver's tests. It has no
  # dependencies, so Node is all it installs.
  api:
    name: api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the API tests
        run: scripts/test/test-api.sh

  # The repository's policy gates and the skills' own suites, in two phases. The light
  # contracts -- policy and skill tests that read only the repository's text -- run on every
  # change, first, with nothing but Python and Node installed: one that needs more fails
  # here, whatever else the change selected. Then, only when the change reaches them, the
  # policy tests and skill suites that load the CAD kernel or the built runtime, after the
  # full install. Repository properties, so Linux only.
  # Required, and selected for every change -- so it also stands guard over the selection. If
  # Changed paths fails, every job it gates is skipped, and GitHub counts a skipped required
  # check as passing: this one runs then, and fails, so nothing merges untested.
  skills:
    name: skills
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skills == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Stop when the selection did not run
        if: needs.changes.result != 'success'
        run: |
          echo "Changed paths did not finish, so nothing was selected and no test ran. Re-run the workflow." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run the light contracts
        env:
          PYTHON_TEST_RUNTIME: "0"
          POLICY: ${{ needs.changes.outputs.light_policy }}
          TESTS: ${{ needs.changes.outputs.light_tests }}
        run: |
          # Space-separated lists of repo paths: split on purpose.
          # shellcheck disable=SC2086
          scripts/test/test-global.sh $POLICY
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --select skills $TESTS

      - name: Set up dependencies
        if: needs.changes.outputs.skills_runtime == 'true'
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      - name: Run the policy gates that load cadgen or its runtime
        if: needs.changes.outputs.skills_policy != ''
        env:
          TESTS: ${{ needs.changes.outputs.skills_policy }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-global.sh $TESTS

      - name: Run the skill suites that drive the CAD kernel
        if: needs.changes.outputs.skills_tests != ''
        env:
          TESTS: ${{ needs.changes.outputs.skills_tests }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --select skills --print-weights $TESTS

  # The docs site: its static asset contract, lint, the Next build and icon verification, and
  # the animated brand marks.
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core apps/docs

      - name: Run documentation checks
        run: scripts/test/test-docs.sh

  # The tree as it ships: the production bundle from clean, the published-tree contract,
  # the wheel's package data, and the CLIs as a user gets them (pip-installed, outside
  # this repo). Properties of the tree, not of an operating system, so Linux only.
  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web apps/mcp

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Check production bundle layout
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      # cadgen ships the JS it executes as package data. A package-data glob that stops
      # matching produces a wheel that imports fine and fails on a user's machine, so the
      # wheel is built and inspected here rather than trusted.
      - name: Check cadgen wheel contents
        env:
          CADGEN_KEEP_WHEEL: "1"
          CADGEN_WHEEL_OUT_DIR: ${{ runner.temp }}/cadgen-wheel-check
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      # The CLIs the way a user gets them -- pip-installed, from a directory that is not
      # this repo -- which is the only place a missing package-data glob or an accidental
      # repo-relative path shows up.
      - name: Run installed-mode checks against the verified wheel
        run: |
          shopt -s nullglob
          wheels=("$RUNNER_TEMP/cadgen-wheel-check/"*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "Expected one verified wheel" >&2; exit 1; }
          scripts/test/test-installed.sh --wheel "${wheels[0]}"
