name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - build-test
  push:
    branches:
      - main
      - build-test

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The VERSION guard below diffs against the PR base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check release version
        run: |
          scripts/release/check-version.sh
          node scripts/release/sync-version.mjs --check

      # Only a release PR moves VERSION. Prepare Release opens those from `release/X.Y.Z`
      # and stamps the metadata and the skill pins with the same commit; a hand-made bump
      # would ship a version whose pins, wheel and tag do not line up.
      - name: Only release/* branches may change VERSION
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- VERSION; then
            echo "VERSION unchanged."
            exit 0
          fi
          case "$HEAD_REF" in
            release/*) echo "VERSION changed on $HEAD_REF (a release PR)." ;;
            *)
              echo "This PR changes VERSION but its branch is '$HEAD_REF', not release/*." >&2
              echo "Version bumps come from the Prepare Release workflow:" >&2
              echo "  gh workflow run release-prepare.yml --ref main -f bump=patch" >&2
              exit 1
              ;;
          esac

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    env:
      # Four test files at a time: each is a kernel-loading interpreter (~450 MB).
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps

      - name: Check generated outputs against sources
        run: scripts/bundle/bundle.sh --check

      - name: Bundle production outputs
        run: scripts/bundle/bundle.sh --clean

      - name: Check production bundle layout
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      - name: Start the bundled CAD Viewer
        run: scripts/test/test-viewer-launch.sh

      # cadgen ships the JS it executes as package data. A package-data glob that stops
      # matching produces a wheel that imports fine and fails on a user's machine, so the
      # wheel is built and inspected here rather than trusted.
      - name: Check cadgen wheel contents
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      - name: Run documentation checks
        run: scripts/test/test-docs.sh

      - name: Run code tests
        run: scripts/test/test.sh

      # Everything above runs against the source tree, where the repo root is importable
      # and every asset is one directory away. This runs the CLIs the way a user gets
      # them -- pip-installed, from a directory that is not this repo -- which is the only
      # place a missing package-data glob or an accidental repo-relative path shows up.
      - name: Run installed-mode checks
        run: scripts/test/test-installed.sh

  # A SEPARATE JOB, never a matrix on `test` above. A matrix renames that job's check to
  # "Test (ubuntu-latest)", and `Test` is a required status check on main -- it would stop
  # being reported and every pull request would wait forever for a check that no longer exists.
  #
  # Runs the TESTS only, not the hygiene steps the Linux job wraps them in. Bundle freshness
  # and the published-tree checks are properties of the repository, not of an operating
  # system; bundling is deterministic, so re-checking it here would buy nothing and cost
  # minutes. The platform risk is in file I/O -- locks, paths, subprocesses, file
  # URLs -- which is what the test suites exercise.
  #
  # Why this job exists at all: four of the last five user-reported bugs were Windows-only
  # (#260, #266, #267, #269), and every one of them passed CI. The coverage was mostly already
  # written -- test_coordination.py's holder test asserts exactly the cross-process sentinel
  # read that #269 broke -- so what was missing was a runner, not a test.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    env:
      # Four test files at a time: each is a kernel-loading interpreter (~450 MB).
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps

      # Three steps rather than test.sh, each running even if an earlier one failed, and the
      # Python runner in --keep-going mode. While Windows is being brought up the failures are
      # independent POSIX-isms in unrelated suites, and stopping at the first one turns a list
      # into one ~10 minute round trip per entry. The Linux job keeps the fail-fast default.
      - name: Run JS tests
        run: scripts/test/test-js.sh
        shell: bash

      - name: Run Python tests
        if: ${{ !cancelled() }}
        run: scripts/test/test-python.sh --keep-going
        shell: bash

      # test-global.sh is deliberately absent, for the same reason the bundle step is. It asserts REPOSITORY policy -- that manifests pin the canonical version,
      # that lockfiles do not reach outside a skill, that the release scripts read the right
      # VERSION path at a given ref -- by executing the repo's own bash tooling. None of that
      # is shipped to a Windows user, and none of its answers can differ by operating system;
      # running it here only asks whether `bash` on a Windows runner behaves like bash, which
      # it does not (it resolves to the WSL stub and answers in UTF-16).

  # A THIRD separate job, for the same reason `test-windows` is one: `Test` is a
  # required status check on main, and turning either of the jobs above into a matrix
  # would rename its check and leave every pull request waiting for a check that no
  # longer exists.
  #
  # macOS because the desktop app's two native modules (better-sqlite3, node-pty) are
  # rebuilt against Electron's ABI by `npm ci`'s postinstall, and macOS is both the
  # platform this app is developed on and the one whose packaging (hardened runtime,
  # notarisation, arm64 + x64) has the most that can go wrong. Its own `npm ci`: the
  # desktop app is a standalone npm project like apps/viewer, and the Linux job's
  # setup-deps knows nothing about it.
  #
  # The Playwright step drives the BUILT app through `_electron`, so no browser
  # download is needed -- `playwright install` would fetch three browsers this suite
  # never opens -- and no xvfb, because macOS has a display server.
  desktop:
    name: Desktop (macOS)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      # postinstall runs `electron-builder install-app-deps`, which is what rebuilds
      # better-sqlite3 and node-pty for Electron. A plain `npm ci --ignore-scripts`
      # would install them for Node's ABI and every database test would fail to load.
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Typecheck
        run: npm --prefix apps/desktop run typecheck

      - name: Lint
        run: npm --prefix apps/desktop run lint

      - name: Run unit tests
        run: npm --prefix apps/desktop test

      - name: Build
        run: npm --prefix apps/desktop run build

      - name: Run the Electron smoke test
        run: npm --prefix apps/desktop run e2e

      # The screenshots the e2e writes are the cheapest review of whether the app
      # still looks like an app; a failed run's are the more interesting ones.
      - name: Upload Playwright screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: apps/desktop/tests/e2e/__screenshots__/*.png
          if-no-files-found: ignore
