# The repo's test workflow: one job per thing that has to work, each conditional on
# the changes that can break it. No gates, no shards. A job skipped by its own
# condition satisfies its required check, so a prose-only pull request runs Version
# Check and nothing else.
#
# WHAT CAN BREAK WHAT (the dependency graph the conditions encode)
#   packages/cadgen     the Python engine, CLI doors, daemon and the CAD Viewer BACKEND.
#                       Everything downstream runs it: the skills (thin entrypoints over
#                       its CLIs), the viewer (served by cadgen.viewer), the docs site
#                       (documents its commands), the wheel.
#   packages/cadgen-js  bundled into the runtime cadgen executes (mesh exports,
#                       snapshots), imported by the viewer client, and by the docs hero.
#   apps/viewer         the client. Platform-agnostic JS; served by the backend.
#   skills/             SKILL.md + scripts. Their suites run the cadgen CLIs; the docs
#                       site mirrors their frontmatter.
#   apps/docs           the docs site.
#   scripts/, .github/, version metadata ("infra"): can break any job.
#   Root *.md, notes/, models/, LICENSE ("prose"): read by no test. Markdown under
#   skills/ and packages/cadgen/ is NOT prose -- test_documented_commands,
#   test_skill_requirements and test_package_boundaries read it.
#
# WHAT RUNS WHERE
#   Version Check     ubuntu   always: VERSION, derived metadata, skill pins
#   cadgen (Linux)    ubuntu   the cadgen package suite, viewer backend included
#   cadgen (Windows)  windows  the SAME suite. This is the one thing that must be
#                              proven on Windows: paths, locks, subprocesses, file
#                              URLs, the daemon, the viewer backend. Nothing else
#                              runs there -- bundling, packaging, policy and the JS
#                              suites are properties of the tree or of a browser,
#                              not of an operating system.
#   cadgen-js         ubuntu   cadgen-js unit tests (+ the viewer-memory bench helpers)
#   viewer            ubuntu   the client's unit tests, then the bundled client
#                              launched through the real backend
#   skills            ubuntu   the policy gates (tests/python/global) + every skill suite
#   docs              ubuntu   the docs site check
#   packaging         ubuntu   bundle from clean, published-tree contract, wheel
#                              package data, the CLIs pip-installed outside the repo
#
# Each job parallelises internally (unittest_files.py --jobs, node --test concurrency).
# The packaged runtime is gitignored and built by whichever job needs it
# (scripts/test/common.sh ensure_packaged_runtime, ~13 s).
#
name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - build-test
  push:
    branches:
      - main
      - build-test

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, as the classes above. Every other job's `if:` reads these.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      cadgen: ${{ steps.filter.outputs.cadgen }}
      cadgenjs: ${{ steps.filter.outputs.cadgenjs }}
      viewer: ${{ steps.filter.outputs.viewer }}
      skills: ${{ steps.filter.outputs.skills }}
      docs: ${{ steps.filter.outputs.docs }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cadgen:
              - 'packages/cadgen/**'
              - 'tests/python/packages/**'
              - 'tests/python/support/**'
              - 'requirements*.txt'
            cadgenjs:
              - 'packages/cadgen-js/**'
            viewer:
              - 'apps/viewer/**'
              - 'tests/browser/**'
            skills:
              - 'skills/**'
              - 'tests/python/skills/**'
              - 'tests/python/global/**'
            docs:
              - 'apps/docs/**'
            infra:
              - 'scripts/**'
              - '.github/**'
              - 'VERSION'
              - '.claude-plugin/**'
              - '.codex-plugin/**'
              - 'package.json'
              - 'package-lock.json'
              - '.gitattributes'
              - '.gitignore'

  version:
    name: Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The VERSION guard below diffs against the PR base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check release version
        run: |
          scripts/release/check-version.sh
          node scripts/release/sync-version.mjs --check

      # Only a release PR moves VERSION. Prepare Release opens those from `release/X.Y.Z`
      # and stamps the metadata and the skill pins with the same commit; a hand-made bump
      # would ship a version whose pins, wheel and tag do not line up.
      - name: Only release/* branches may change VERSION
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- VERSION; then
            echo "VERSION unchanged."
            exit 0
          fi
          case "$HEAD_REF" in
            release/*) echo "VERSION changed on $HEAD_REF (a release PR)." ;;
            *)
              echo "This PR changes VERSION but its branch is '$HEAD_REF', not release/*." >&2
              echo "Version bumps come from the Prepare Release workflow:" >&2
              echo "  gh workflow run release-prepare.yml --ref main -f bump=patch" >&2
              exit 1
              ;;
          esac

  # The cadgen package suite, CAD Viewer backend included, on both platforms. cadgen-js
  # is in the condition because it is bundled into the runtime these tests execute.
  cadgen-linux:
    name: cadgen (Linux)
    needs: changes
    if: needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      # Test files at a time: each is a kernel-loading interpreter (~450 MB).
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/cadgen-js

      - name: Run the cadgen package suite
        run: scripts/test/test-python.sh --select cadgen

  # Why Windows runs at all: four of the last five user-reported bugs were Windows-only
  # (#260, #266, #267, #269) and every one passed CI -- the coverage existed, the runner
  # did not. The platform risk is file I/O: locks, paths, subprocesses, file URLs, the
  # daemon, the viewer backend. That is this suite, and only this suite.
  cadgen-windows:
    name: cadgen (Windows)
    needs: changes
    if: needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: windows-latest
    env:
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/cadgen-js

      # --keep-going: report every failing suite in one round trip rather than one per
      # run; the Linux job keeps the fail-fast default.
      - name: Run the cadgen package suite
        run: scripts/test/test-python.sh --keep-going --select cadgen
        shell: bash

  cadgen-js:
    name: cadgen-js
    needs: changes
    if: needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/cadgen-js

      - name: Run cadgen-js tests
        run: npm --prefix packages/cadgen-js test

      - name: Run the viewer-memory bench helper tests
        run: node --test scripts/bench/viewer-memory/*.test.mjs

  # The client is platform-agnostic JS, so Linux only. It runs on a cadgen change too:
  # the launch step serves the bundled client through the real backend.
  viewer:
    name: viewer
    needs: changes
    if: needs.changes.outputs.viewer == 'true' || needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/cadgen-js apps/viewer

      - name: Run the CAD Viewer client tests
        run: npm --prefix apps/viewer run test

      - name: Bundle production outputs
        run: scripts/bundle/bundle.sh

      - name: Launch the bundled CAD Viewer through the backend
        run: scripts/test/test-viewer-launch.sh

  # The policy gates read the repo's markdown and manifests; the skill suites run the
  # cadgen CLIs. Repository properties, so Linux only.
  skills:
    name: skills
    needs: changes
    if: needs.changes.outputs.skills == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/cadgen-js

      - name: Run the policy gates
        run: scripts/test/test-global.sh

      - name: Run every skill suite
        run: scripts/test/test-python.sh --select skills

  # The docs site mirrors the skills' frontmatter, renders through cadgen-js and
  # documents cadgen's commands, so it runs on any of those changing.
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.skills == 'true' || needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: apps/docs

      - name: Run documentation checks
        run: scripts/test/test-docs.sh

  # The tree as it ships: the production bundle from clean, the published-tree contract,
  # the wheel's package data, and the CLIs as a user gets them (pip-installed, outside
  # this repo). Properties of the tree, not of an operating system, so Linux only.
  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.cadgenjs == 'true' || needs.changes.outputs.viewer == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/cadgen-js apps/viewer

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Check production bundle layout
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      # cadgen ships the JS it executes as package data. A package-data glob that stops
      # matching produces a wheel that imports fine and fails on a user's machine, so the
      # wheel is built and inspected here rather than trusted.
      - name: Check cadgen wheel contents
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      # The CLIs the way a user gets them -- pip-installed, from a directory that is not
      # this repo -- which is the only place a missing package-data glob or an accidental
      # repo-relative path shows up.
      - name: Run installed-mode checks
        run: scripts/test/test-installed.sh
