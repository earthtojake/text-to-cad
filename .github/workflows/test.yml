# One job per concern, selected by the dependency graph. Shared core feeds
# cadgen's runtime, UI, web, docs and desktop; UI feeds web and desktop. Apps
# never feed another app. Policy checks run for changed shared contracts without
# also running every skill suite. Runtime outputs are built only where needed.
#
# Check names are the jobs' concerns: `core-js` tests packages/core, `web` tests
# packages/ui and apps/web and drives the bundled viewer. main's required checks
# name all eight jobs.
# Desktop (macOS) also runs for desktop/shared/runtime changes; it is not yet a
# required check. Prose-only root changes run Version Check only; skill/package Markdown remains
# test input.
name: Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - build-test
  push:
    branches:
      - main
      - build-test

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What changed, as the classes above. Every other job's `if:` reads these.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      cadgen: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cadgen == 'true' }}
      core: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core == 'true' }}
      ui: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ui == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web == 'true' }}
      desktop: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.desktop == 'true' }}
      skills: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.skills == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      infra: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.infra == 'true' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            cadgen:
              - 'packages/cadgen/**'
              - 'tests/python/packages/**'
              - 'tests/python/support/**'
              - 'requirements*.txt'
            core:
              - 'packages/core/**'
            ui:
              - 'packages/ui/**'
            desktop:
              - 'apps/desktop/**'
            web:
              - 'apps/web/**'
              - 'tests/browser/**'
            skills:
              - 'skills/**'
              - 'tests/python/skills/**'
              - 'tests/python/global/**'
            docs:
              - 'apps/docs/**'
            infra:
              - 'scripts/**'
              - '.github/**'
              - 'VERSION'
              - '.claude-plugin/**'
              - '.codex-plugin/**'
              - 'package.json'
              - 'package-lock.json'
              - '.gitattributes'
              - '.gitignore'

  version:
    name: Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The VERSION guard below diffs against the PR base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check release version
        run: |
          scripts/release/check-version.sh
          node scripts/release/sync-version.mjs --check

      # Only a release PR moves VERSION. Prepare Release opens those from `release/X.Y.Z`
      # and stamps the metadata and the skill pins with the same commit; a hand-made bump
      # would ship a version whose pins, wheel and tag do not line up.
      - name: Only release/* branches may change VERSION
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/release/check-pr-version.sh "$BASE_REF" "$HEAD_REF" "$HEAD_SHA"

  # The cadgen package suite, CAD Viewer backend included, on both platforms. Core
  # is in the condition because it is bundled into the runtime these tests execute.
  cadgen-linux:
    name: cadgen (Linux)
    needs: changes
    if: needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      # Test files at a time: each is a kernel-loading interpreter (~450 MB).
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      - name: Run the cadgen package suite
        run: scripts/test/test-python.sh --select cadgen --print-weights

  # Why Windows runs at all: four of the last five user-reported bugs were Windows-only
  # (#260, #266, #267, #269) and every one passed CI -- the coverage existed, the runner
  # did not. The platform risk is file I/O: locks, paths, subprocesses, file URLs, the
  # daemon, the viewer backend. That is this suite, and only this suite.
  cadgen-windows:
    name: cadgen (Windows)
    needs: changes
    if: needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: windows-latest
    env:
      # Four, the core count. Six was measured: every file slowed by ~40% and the
      # run failed on timeouts -- the spawn-bound tail is not idle CPU to fill.
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      # --keep-going: report every failing suite in one round trip rather than one per
      # run; the Linux job keeps the fail-fast default.
      - name: Run the cadgen package suite
        run: scripts/test/test-python.sh --keep-going --select cadgen --print-weights
        shell: bash

  core-js:
    name: core-js
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core

      - name: Run shared core tests
        run: scripts/test/test-js.sh --select core


  # The client is platform-agnostic JS, so Linux only. It runs on a cadgen change too:
  # the launch step serves the bundled client through the real backend and draws it in
  # Playwright's Chromium, which is why this job keeps the Playwright install.
  web:
    name: web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web
          ui-browser: "true"

      - name: Run shared UI tests
        if: needs.changes.outputs.ui == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'
        # One browser spec at a time: each renders WebGL in software here (SwiftShader), and
        # several at once saturate the runner's four cores until clicks time out.
        env:
          UI_BROWSER_TEST_CONCURRENCY: "1"
        run: scripts/test/test-js.sh --select ui

      - name: Run the CAD Viewer client tests
        if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'
        run: scripts/test/test-js.sh --select web

      - name: Bundle production outputs
        run: scripts/bundle/bundle.sh

      - name: Launch the bundled CAD Viewer through the backend
        run: scripts/test/test-viewer-launch.sh

      - name: Exercise the bundled viewer in Chromium
        env:
          VIEWER_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/viewer-browser
        run: scripts/test/test-viewer-browser.sh

      - name: Upload failed viewer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-browser-diagnostics
          path: ${{ runner.temp }}/viewer-browser
          if-no-files-found: ignore
          retention-days: 3

  # The policy gates read the repo's markdown and manifests; the skill suites run the
  # cadgen CLIs. Repository properties, so Linux only.
  skills:
    name: skills
    needs: changes
    if: needs.changes.outputs.skills == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    env:
      CADGEN_TEST_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core

      - name: Run the policy gates
        run: scripts/test/test-global.sh

      - name: Run every skill suite
        if: needs.changes.outputs.skills == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.infra == 'true'
        run: scripts/test/test-python.sh --select skills --print-weights

  # The docs site mirrors the skills' frontmatter, renders through core and
  # documents cadgen's commands, so it runs on any of those changing.
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.skills == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core apps/docs

      - name: Run documentation checks
        run: scripts/test/test-docs.sh

  # The tree as it ships: the production bundle from clean, the published-tree contract,
  # the wheel's package data, and the CLIs as a user gets them (pip-installed, outside
  # this repo). Properties of the tree, not of an operating system, so Linux only.
  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Check production bundle layout
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      # cadgen ships the JS it executes as package data. A package-data glob that stops
      # matching produces a wheel that imports fine and fails on a user's machine, so the
      # wheel is built and inspected here rather than trusted.
      - name: Check cadgen wheel contents
        env:
          CADGEN_KEEP_WHEEL: "1"
          CADGEN_WHEEL_OUT_DIR: ${{ runner.temp }}/cadgen-wheel-check
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      # The CLIs the way a user gets them -- pip-installed, from a directory that is not
      # this repo -- which is the only place a missing package-data glob or an accidental
      # repo-relative path shows up.
      - name: Run installed-mode checks against the verified wheel
        run: |
          shopt -s nullglob
          wheels=("$RUNNER_TEMP/cadgen-wheel-check/"*.whl)
          [ "${#wheels[@]}" -eq 1 ] || { echo "Expected one verified wheel" >&2; exit 1; }
          scripts/test/test-installed.sh --wheel "${wheels[0]}"

  # Electron/native integration follows only its actual dependencies. Budget: ten
  # minutes. Everything before the e2e restores what an earlier green run already
  # produced from the same inputs -- the checkout venv, typecheck and lint state, the
  # built app -- because this runner is small (3 cores, 7 GB) and the renderer build
  # alone is minutes on it.
  desktop:
    name: Desktop (macOS)
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.ui == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.cadgen == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # ui-browser: the unit tests include the PDF renderer's Chromium suite
      # (apps/desktop/tests/browser), which launches headless, so the headless shell
      # is all it needs; the Electron e2e needs no Playwright browser. Python is the
      # checkout venv below, not requirements-dev.txt in the runner's interpreter.
      - name: Set up desktop dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/desktop
          python: "false"
          ui-browser: shell

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # CadRuntime runs the checkout's .venv. Installing requirements-dev.txt is ~30 s
      # of unpacking wheels (OCP, scipy) on every run, so the venv is cached on what
      # decides it: the interpreter it links to and the two files pip reads. Its
      # editable cadgen follows the source; unpinned dependencies stay at what the
      # cached install resolved until one of those files changes.
      - name: Restore the checkout venv
        id: venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: desktop-venv-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-dev.txt', 'packages/cadgen/pyproject.toml') }}

      - name: Create the checkout venv
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      # The app's renderer supplies the UI. CAD tests need only cadgen's Node and
      # browser assets (from core, which setup already built) and the native modules
      # rebuilt against Electron's ABI.
      - name: Prepare the CAD runtime
        env:
          CADGEN_RUNTIME_PACKAGES_BUILT: "1"
        run: scripts/bundle/cadgen-runtime.sh --node --browser

      # `native:rebuild` (electron-builder install-app-deps) rebuilds node-pty and
      # better-sqlite3 against Electron's ABI, about 8-12 s on this runner. Both load
      # their addon from their own `build/Release` (node-pty's pty.node and spawn-helper,
      # better-sqlite3's better_sqlite3.node), so those two directories are the whole
      # output and the rebuild is skipped when they are restored. Keyed on the lockfile
      # (their versions) and Electron's version (the ABI) plus the runner's OS and
      # architecture. Restored after `npm ci` has put the package sources in place.
      - name: Read the Electron version
        id: electron
        run: echo "version=$(node -p "require('electron/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the native modules
        id: native
        uses: actions/cache@v5
        with:
          path: |
            node_modules/node-pty/build
            node_modules/better-sqlite3/build
          key: desktop-native-${{ runner.os }}-${{ runner.arch }}-electron${{ steps.electron.outputs.version }}-${{ hashFiles('package-lock.json') }}

      - name: Rebuild the native modules
        if: steps.native.outputs.cache-hit != 'true'
        run: npm run native:rebuild -w @text-to-cad/desktop

      # Both resume from the last green run: tsc's buildinfo (the projects are
      # composite) re-checks what changed and what depends on it, and ESLint's
      # content-keyed cache re-lints changed files -- no rule here is type-aware, so a
      # file's lint result depends on that file and the config alone.
      - name: Restore typecheck and lint state
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/node_modules/.tmp
            apps/desktop/node_modules/.cache/eslint
          key: desktop-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: desktop-checks-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm --prefix apps/desktop run typecheck

      - name: Lint
        run: npm --prefix apps/desktop run lint -- --cache --cache-strategy content --cache-location node_modules/.cache/eslint/

      - name: Run unit tests
        run: npm --prefix apps/desktop test

      # The same inputs build the same out/, so a commit whose build inputs a green run
      # already built -- a cadgen- or CI-only change, a re-run -- restores it instead.
      # The key is git's own hashes of every committed input: the app less its tests,
      # test configs and prose; the two workspaces it bundles; the skills it composes;
      # the library builder; the lockfile; VERSION.
      - name: Hash the build inputs
        id: build-inputs
        run: |
          {
            git ls-tree HEAD apps/desktop/ | grep -Ev $'\t''apps/desktop/(tests|docs|README\.md|AGENTS\.md|playwright\.config\.ts|vitest\.config\.ts|eslint\.config\.mjs)$'
            git ls-tree HEAD packages/core packages/ui skills scripts/build package-lock.json VERSION
          } | git hash-object --stdin | sed 's/^/hash=/' >> "$GITHUB_OUTPUT"

      - name: Restore the build
        id: build
        uses: actions/cache@v5
        with:
          path: |
            apps/desktop/out
            apps/desktop/resources/skills
          key: desktop-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-inputs.outputs.hash }}

      - name: Build
        if: steps.build.outputs.cache-hit != 'true'
        run: npm --prefix apps/desktop run build

      # The unit run above comes before the build, so its bundle check found no
      # out/renderer and stood aside. This is that check with a bundle to read, and
      # the variable makes a missing one a failure rather than a pass. A restored
      # build was checked by the green run that saved it.
      - name: Check the renderer bundle
        if: steps.build.outputs.cache-hit != 'true'
        env:
          TEXT_TO_CAD_BUNDLE_CHECK: "1"
        working-directory: apps/desktop
        run: npx vitest run tests/unit/main/renderer-bundle.test.ts

      - name: Run the Electron integration suite
        env:
          TEXT_TO_CAD_E2E_REQUIRE_CAD: "1"
        run: npm --prefix apps/desktop run e2e

      # The screenshots the e2e writes are the cheapest review of whether the app
      # still looks like an app; a failed run's are the more interesting ones.
      - name: Upload Playwright screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-screenshots
          path: apps/desktop/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload failed Electron traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results
          path: apps/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 3
