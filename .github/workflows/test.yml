# One job per concern, one flag per job. What a change can break decides what runs:
# scripts/github-workflows/select_checks.py maps every changed path to its component (the
# packages, the UI, an app, a suite), and each job below runs whole on its own flag or is
# skipped; no step inside a job reads another flag. A path the table does not know runs everything, and so
# does a VERSION change, a manual run or the nightly one -- a release is tested whole.
#
# The tiers:
#   static     every change, nothing installed: the version and tree checks, the light contracts,
#              the API's tests.
#   unit       the packages' suites on Linux (packages), the JS workspaces (js-*), docs, skills.
#   platform   the packages' suites on Windows; the router's unit files on macOS.
#   integration  fea, kicad, blender, packaging, viewer-e2e: each with what it drives installed.
#   release    a full run only (and a change to the thing itself): the packages' suites on their
#              oldest Python, and the installer rehearsals.
#   CI         the one required check: every job above that ran passed (ci_gate.py).
#
# main requires `CI` alone, so a job is added, renamed, split or sharded here without a
# branch-protection change, and no job can fail without stopping the merge.
#
# Every run records the tree it tested (an artifact named tested-<tree>-<scope>). A push whose
# tree its pull request already tested with the same selection runs nothing again, the nightly
# run stands down for a tree already tested in full, and Publish Release ships a release commit
# without re-testing it when a run here tested its tree in full
# (scripts/github-workflows/tested_tree.py). Publish Release also calls this workflow with
# `full` when it finds no such run.
name: Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every job, whatever changed.
        type: boolean
        default: false
      ref:
        description: The commit to test; the caller's commit when empty.
        type: string
        default: ""
  pull_request:
    branches:
      - main
      - build-test
  push:
    branches:
      - main
      - build-test
  # Nightly, on main: the release tier for whatever merged without a release. Nothing runs
  # when a run already tested main's tree in full.
  schedule:
    - cron: "23 8 * * *"

# github.workflow is the CALLER's name when Publish Release calls this, so its run never
# queues behind -- or cancels -- this workflow's own runs on the same branch. The nightly run
# has a group of its own: in main's, a merge's push run would replace it while it waited.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Timeouts. A job's is about twice its slowest observed run, and a job that runs Python test
  # files has at least its slowest run and 11 minutes more: unittest_files.py's per-file hang
  # guard (10 minutes, and a minute's backstop) fires first, names the file and stops the run.
  # Every install step has a timeout of its own: a stalled mirror fails in minutes, not at the
  # job's. (The blender and KiCad suites fetch their environments as they run, and the
  # rehearsals are installs: those are bounded by their job.)
  #
  # What the change can break, as flags and test paths. Every gated job reads these.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # A push looks up the run that already tested its tree (tested_tree.py).
      actions: read
    outputs:
      core_js: ${{ steps.select.outputs.core_js }}
      web_ui: ${{ steps.select.outputs.web_ui }}
      web_client: ${{ steps.select.outputs.web_client }}
      web_viewer: ${{ steps.select.outputs.web_viewer }}
      mcp: ${{ steps.select.outputs.mcp }}
      docs: ${{ steps.select.outputs.docs }}
      packaging: ${{ steps.select.outputs.packaging }}
      kicad: ${{ steps.select.outputs.kicad }}
      fea: ${{ steps.select.outputs.fea }}
      bpy: ${{ steps.select.outputs.bpy }}
      floor: ${{ steps.select.outputs.floor }}
      routing: ${{ steps.select.outputs.routing }}
      installer: ${{ steps.select.outputs.installer }}
      packages: ${{ steps.select.outputs.packages }}
      packages_tests: ${{ steps.select.outputs.packages_tests }}
      linux_shards: ${{ steps.select.outputs.linux_shards }}
      windows_shards: ${{ steps.select.outputs.windows_shards }}
      changed_tests: ${{ steps.select.outputs.changed_tests }}
      skills: ${{ steps.select.outputs.skills }}
      skills_policy: ${{ steps.select.outputs.skills_policy }}
      skills_tests: ${{ steps.select.outputs.skills_tests }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The commit and its parents: a pull request's merge commit is diffed against its
          # first parent, the target branch as it is now; a push fetches `before` itself.
          fetch-depth: 2
          persist-credentials: false

      - name: Select what this change can break
        id: select
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || inputs.full }}
          # Only a push diffs against `before`; a pull request's synchronize event carries one too.
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github-workflows/select_checks.py

      # A record only saves running the tests again, so failing to upload one fails nothing: the
      # tests still run here, and the push and Publish Release, finding no record, test again.
      - name: Record the tree this run tests
        if: steps.select.outputs.record != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.select.outputs.record }}
          path: ${{ runner.temp }}/selection.json
          retention-days: 90
          overwrite: true

  # ---- static: every change, nothing installed but Python and Node ------------------------------

  # Selected by nothing, so it waits on nothing: the canonical version, the derived metadata and
  # the pins; on a pull request, what merging it releases (a pull request that changes VERSION is
  # a release, only a branch of this repository may carry one, and only to a version past the
  # target's and the latest tag: scripts/release/check-pr-version.sh); the tracked tree's rules;
  # the light contracts -- the policy tests and skill suites that read only the repository's
  # text, where one that needs more fails; and the API's tests, which install nothing.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # The release guard reads the target branch's history and the release tags.
          fetch-depth: 0

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up Node.js
        timeout-minutes: 5
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check release version
        run: |
          scripts/release/check-version.sh
          node scripts/release/sync-version.mjs --check

      - name: Check what merging releases
        if: github.event_name == 'pull_request'
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: scripts/release/check-pr-version.sh "$HEAD_REPO" | tee -a "$GITHUB_STEP_SUMMARY"

      # The shipping contract's tree rules hold for every change, docs and models
      # included, and need no runtime: no symlink, no LFS or other rewriting
      # .gitattributes rule, every file under 5 MiB, no skill reaching into a repo root.
      - name: Check the tracked tree
        run: scripts/github-workflows/check-builds.sh --tree-only

      - name: Run the light contracts
        run: |
          # Space-separated lists of repo paths: split on purpose.
          # shellcheck disable=SC2046
          scripts/test/test-global.sh $(python3 scripts/github-workflows/select_checks.py --light policy)
          # shellcheck disable=SC2046
          scripts/test/test-python.sh --select skills $(python3 scripts/github-workflows/select_checks.py --light skills)

      - name: Run the API tests
        run: scripts/test/test-api.sh

  # ---- unit and platform: the packages' suites ---------------------------------------------------

  # The library's, the server's (the engine's and the CAD Viewer backend's included) and the
  # shim's suites, or the test files of them a change itself edits. Run whole they are split
  # over shards, each taking its share of every suite (CAD_TEST_SHARD); a narrowed selection is
  # one shard. The first shard also checks the types,
  # and runs the test files the change itself touches before the suite, so a break in a pull
  # request's own test is reported in a minute or two.
  packages-linux:
    name: packages (Linux ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.linux_shards) }}
    env:
      # Test files at a time: each is a kernel-loading interpreter (~450 MB).
      CAD_TEST_JOBS: "4"
      # A test file's budget in seconds: the runner names one that takes longer (it never fails
      # for it), and such a file is split. A shard cannot finish sooner than its slowest file.
      CAD_TEST_FILE_BUDGET: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core
          # The display the engine's stills draw on.
          apt: xvfb libgl1-mesa-dri fonts-dejavu-core

      - name: Check the packages' types (basic)
        if: startsWith(matrix.shard, '1/')
        run: |
          for project in cad cad-server cad-mcp; do
            python -m pyrefly check --config "packages/$project/pyproject.toml" --output-format full-text-with-github
          done

      - name: Run the tests this change touches first
        if: startsWith(matrix.shard, '1/') && needs.changes.outputs.changed_tests != ''
        env:
          TESTS: ${{ needs.changes.outputs.changed_tests }}
        run: |
          # TESTS is a space-separated list of repo paths: split on purpose.
          # shellcheck disable=SC2086
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" \
            scripts/test/test-python.sh --select cadgen $TESTS

      - name: Run the packages' suites
        env:
          TESTS: ${{ needs.changes.outputs.packages_tests }}
          CAD_TEST_SHARD: ${{ matrix.shard }}
        run: |
          # shellcheck disable=SC2086
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" \
            scripts/test/test-python.sh --select cadgen --print-weights $TESTS

  # Why Windows runs at all: four of five user-reported bugs in one stretch were Windows-only
  # (#260, #266, #267, #269) and every one passed CI -- the coverage existed, the runner did
  # not; and in the 52 failed jobs read before this layout, 27 were this suite's, most of them
  # a pull request's own new test (a POSIX path, a line ending, a .cmd shim). The platform risk
  # is file I/O: locks, paths, subprocesses, file URLs, the daemon, the viewer backend. That is
  # this suite, and only this suite. The types are checked here too: the checker reads the
  # win32 branches only on Windows.
  packages-windows:
    name: packages (Windows ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.windows_shards) }}
    env:
      # Four, the core count. Six was measured: every file slowed by ~40% and the
      # run failed on timeouts -- the spawn-bound tail is not idle CPU to fill.
      CAD_TEST_JOBS: "4"
      # The same files take about twice as long here as on Linux.
      CAD_TEST_FILE_BUDGET: "240"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core

      - name: Check the packages' types (basic)
        if: startsWith(matrix.shard, '1/')
        run: |
          for project in cad cad-server cad-mcp; do
            python -m pyrefly check --config "packages/$project/pyproject.toml" --output-format full-text-with-github
          done
        shell: bash

      - name: Run the tests this change touches first
        if: startsWith(matrix.shard, '1/') && needs.changes.outputs.changed_tests != ''
        env:
          TESTS: ${{ needs.changes.outputs.changed_tests }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --keep-going --select cadgen $TESTS
        shell: bash

      # --keep-going: report every failing suite in one round trip rather than one per
      # run; the Linux job keeps the fail-fast default.
      - name: Run the packages' suites
        env:
          TESTS: ${{ needs.changes.outputs.packages_tests }}
          CAD_TEST_SHARD: ${{ matrix.shard }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --keep-going --select cadgen --print-weights $TESTS
        shell: bash

  # The router's copper is the same bits on every OS, or it is not deterministic: its unit files hold one
  # board's copper to a digest (test_kicad_routing_determinism.py). The packages jobs run them on Linux
  # (glibc) and Windows (the MSVC runtime); this job runs them on macOS, the third C library, with every
  # change to the packages. The library alone (numpy; no kernel, no KiCad): under a minute, most of it
  # the runner and Python starting.
  routing-macos:
    name: routing (macOS)
    needs: changes
    if: needs.changes.outputs.routing == 'true'
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install the library alone
        timeout-minutes: 5
        run: python -m pip install --editable ./packages/cad

      - name: Run the router's unit files
        env:
          PYTHON_BIN: python
        run: scripts/test/test-routing.sh

  # ---- release tier: a full run, or a change to the thing itself ---------------------------------

  # The library's, the server's and the shim's suites on Python 3.13, the packages' floor
  # (test-floor.sh), in an environment made here with requirements-dev.txt: a call the floor's
  # standard library lacks parses there and fails only when it runs (one reached the server
  # once: argparse's suggest_on_error), so only the suites hold the floor. A third run of
  # suites the packages jobs already run on the Python the server's installations use, for a
  # rare kind of break: so it runs before a release ships (a VERSION change), nightly and on a
  # manual run, not on every push. Whole, unsharded: 7 to 14 minutes.
  packages-floor:
    name: packages (Python 3.13 floor)
    needs: changes
    if: needs.changes.outputs.floor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAD_TEST_FILE_BUDGET: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: none
          apt: xvfb libgl1-mesa-dri fonts-dejavu-core

      - name: Make an environment on Python 3.13, the packages' floor
        timeout-minutes: 10
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/floor"
          uv pip install --python "$RUNNER_TEMP/floor/bin/python" -r requirements-dev.txt

      - name: Run the library's, the server's and the shim's suites on the floor
        env:
          PYTHON_BIN: ${{ runner.temp }}/floor/bin/python
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" scripts/test/test-floor.sh

  # The installer rehearsals: install.sh and install.ps1 on a fresh machine, the way a person
  # runs them, against the wheel this tree builds (install-linux.yml, install-windows.yml).
  # Before a release ships (a full run), and on a change to the installers themselves.
  install-linux:
    name: install (Linux)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    uses: ./.github/workflows/install-linux.yml
    with:
      ref: ${{ inputs.ref }}

  install-windows:
    name: install (Windows)
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    uses: ./.github/workflows/install-windows.yml
    with:
      ref: ${{ inputs.ref }}

  # ---- integration: each with what it drives installed -------------------------------------------

  # The stress study (cad <type> solve) and its result (cad fea) with their integrations installed as on a
  # person's computer: netgen, cad[netgen], meshes, and CalculiX's ccx, cad[calculix] (the cad-ccx package), solves.
  # Its suite (tests/python/packages/fea, test-fea.sh) is this job's alone: the study's parse, checks and
  # materials, the solves against hand calculations, assemblies, the results folder and its pictures (drawn under
  # Xvfb), and the command through the library's runner of one operation. Linux only: the stack is the same
  # wheels everywhere, and the solves are CPU-bound. About 2 minutes.
  fea:
    name: fea
    needs: changes
    if: needs.changes.outputs.fea == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAD_TEST_FILE_BUDGET: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core
          # A solve draws a picture of each field with the engine's stills.
          apt: xvfb libgl1-mesa-dri fonts-dejavu-core

      # The netgen and calculix integrations' extras, with netgen pinned to the version the accuracy tests'
      # margins were measured with (the round rod's top-fibre stress is +8.6% against 10%); the extra keeps the
      # floor. The calculix extra pins cad-ccx (conda-forge's CalculiX, repackaged: earthtojake/ccx), the wheel
      # PyPI has for this runner. A ccx that does not run fails here by name rather than as every solve failing.
      - name: Install the netgen and calculix integrations
        timeout-minutes: 5
        run: |
          uv pip install --system --python python --editable "./packages/cad[build123d,trimesh,netgen,calculix]" \
            "netgen-mesher==6.2.2608"
          python -c "import cad_ccx; print(cad_ccx.executable(), cad_ccx.version())"

      - name: Run the fea suite
        run: xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" scripts/test/test-fea.sh
        shell: bash

  # Blender as a Python module (bpy): the server, on its own Python as everywhere, runs one script that
  # imports cad, build123d and bpy. `cad run` makes the environment of cad[blender,build123d] for it on a
  # Python 3.13 uv manages (bpy 5.2.3: about 430 MB from PyPI for Linux, some 20 s, not cached), a worker of
  # that Python builds its model for the engine, and cad.blender.load loads the GLBs this checkout's cad
  # exports, plays their clips in both orders and renders a 64x64 still with Cycles on the CPU, then one
  # with EEVEE through Mesa's software OpenGL. Nothing in it may skip here: its runner fails a run in which
  # a test did. The suite (tests/python/packages/blender, test-blender.sh) is this job's alone. Linux only:
  # bpy's wheel is one build per platform and no runner has a GPU. About 2 minutes.
  blender:
    name: blender
    needs: changes
    if: needs.changes.outputs.bpy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAD_TEST_FILE_BUDGET: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: none
          # What bpy's Linux wheel loads from the system and does not carry: X11's client libraries, the
          # keyboard map, and OpenGL and EGL with Mesa's software drivers (EEVEE draws through them; Cycles
          # on the CPU needs none). And the display and font the engine's own stills take.
          apt: >-
            libx11-6 libxfixes3 libxi6 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libice6
            libgl1 libegl1 libglx-mesa0 libegl-mesa0 libgl1-mesa-dri xvfb fonts-dejavu-core

      - name: Run the blender suite
        run: scripts/test/test-blender.sh

  # Native KiCad boards through kicode's kicad-cli and KiPy, in the environment of cad[kicad] the server
  # makes, as on a person's computer: DRC, every export, a STEP and mesh round trip of a saved board, and a
  # board's and a schematic's edit through the headless api-server. It runs with every change to
  # the packages, as fea and blender do: viewing and drawing a board need no KiCad and are the package suites'.
  # kicode is ~110 MB from PyPI for Linux (kicode-pcb and kicode-sch), some 10 s; no apt, no PPA.
  kicad:
    name: kicad
    needs: changes
    if: needs.changes.outputs.kicad == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAD_TEST_FILE_BUDGET: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: none

      - name: Run the KiCad suite
        # Makes the environment of cad[kicad] (the checkout's library, editable, and kicode) once, then runs.
        run: scripts/test/test-kicad.sh

  # The policy tests and skill suites that load the CAD kernel or the built runtime (the light
  # ones are `static`'s). Repository properties, so Linux only.
  skills:
    name: skills
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CAD_TEST_JOBS: "4"
      CAD_TEST_FILE_BUDGET: "120"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core

      # Each runner takes the files the change selected; with none it would run its whole suite.
      - name: Run the policy gates that load the packages or their runtime
        if: needs.changes.outputs.skills_policy != ''
        env:
          TESTS: ${{ needs.changes.outputs.skills_policy }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-global.sh $TESTS

      - name: Run the skill suites that need their dependencies
        if: needs.changes.outputs.skills_tests != ''
        env:
          TESTS: ${{ needs.changes.outputs.skills_tests }}
        run: |
          # shellcheck disable=SC2086
          scripts/test/test-python.sh --select skills --print-weights $TESTS

  # ---- unit: the JS workspaces. Platform-agnostic, so Linux only ---------------------------------

  js-core:
    name: js-core
    needs: changes
    if: needs.changes.outputs.core_js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core

      - name: Run shared core tests
        run: scripts/test/test-js.sh --select core

  # The shared UI, as two jobs of about four minutes: `units` is the dependency checks, the type
  # check, the Node tests and Vitest; `browser` is the browser specs, each of which drives a
  # Chromium doing WebGL in software (SwiftShader). Several of those at once saturate the
  # runner's four cores until clicks time out, so they run one at a time.
  js-ui:
    name: js-ui (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.web_ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [units, browser]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          npm: packages/core packages/ui apps/web
          # Only the browser specs drive npm Playwright's Chromium.
          ui-browser: ${{ matrix.part == 'browser' }}

      - name: Run shared UI tests
        env:
          UI_BROWSER_TEST_CONCURRENCY: "1"
        run: scripts/test/test-js.sh --select ui-${{ matrix.part }}

  # The CAD Viewer's client: Node only. The bundled viewer, served through the real backend,
  # is driven in `viewer-e2e`.
  js-web:
    name: js-web
    needs: changes
    if: needs.changes.outputs.web_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core packages/ui apps/web

      - name: Run the CAD Viewer client tests
        run: scripts/test/test-js.sh --select web

  # The CAD app an agent host renders: its host adapter's units in jsdom, and the one-file
  # build it ships as (a build that would leave anything outside index.html fails).
  js-mcp:
    name: js-mcp
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core packages/ui apps/mcp

      - name: Run the CAD app tests and build it
        run: scripts/test/test-js.sh --select mcp

  # The docs site: lint, the Next build and icon verification, and the animated brand marks.
  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core apps/docs

      - name: Run documentation checks
        run: scripts/test/test-docs.sh

  # ---- integration: what ships, and the viewer it serves -----------------------------------------

  # The tree as it ships: the production bundle from clean, the published-tree contract, the
  # wheels' package data, and the CLIs as a user gets them (pip-installed, outside this repo).
  # Properties of the tree, not of an operating system, so Linux only.
  packaging:
    name: packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core packages/ui apps/web apps/mcp

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Check production bundle layout
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      # The server ships the JS it executes as package data. A package-data glob that stops
      # matching produces a wheel that imports fine and fails on a user's machine, so the
      # wheels (the library's, the server's and the shim's) are built and inspected here rather
      # than trusted.
      - name: Check the wheels' contents
        timeout-minutes: 10
        env:
          CAD_KEEP_WHEEL: "1"
          CAD_WHEEL_OUT_DIR: ${{ runner.temp }}/cadgen-wheel-check
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      # The CLIs the way a user gets them -- the three wheels pip-installed together, from a
      # directory that is not this repo -- which is the only place a missing package-data glob or
      # an accidental repo-relative path shows up.
      - name: Run installed-mode checks against the verified wheels
        run: scripts/test/test-installed.sh --wheels "$RUNNER_TEMP/cadgen-wheel-check"

  # The client the wheel ships, served by the real backend and drawn in Chromium: the launch
  # smoke test, then the format and camera gates. The bundle is built here, not passed from
  # `packaging`: an artifact would put this job behind that one for longer than the bundle takes.
  viewer-e2e:
    name: viewer-e2e
    needs: changes
    if: needs.changes.outputs.web_viewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web apps/mcp
          # The launch smoke test drives Python Playwright's Chromium; the browser gates
          # drive npm Playwright's.
          ui-browser: "true"

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Launch the bundled CAD Viewer through the backend
        run: scripts/test/test-viewer-launch.sh

      - name: Exercise the bundled viewer in Chromium
        env:
          VIEWER_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/viewer-browser
        run: scripts/test/test-viewer-browser.sh

      - name: Upload failed viewer diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: viewer-browser-diagnostics
          path: ${{ runner.temp }}/viewer-browser
          if-no-files-found: ignore
          retention-days: 3

  # ---- the gate ----------------------------------------------------------------------------------

  # The one required check. It needs every job above and runs whatever became of them: a job
  # passes by succeeding or by being skipped for its flag, and the run fails when the selection
  # did not run (every job it gates was then skipped having tested nothing, and GitHub counts a
  # skipped check as passing), when a job failed, or when one was cancelled or timed out --
  # unless a newer push superseded this pull request's run (scripts/github-workflows/ci_gate.py).
  ci:
    name: CI
    needs:
      - changes
      - static
      - packages-linux
      - packages-windows
      - routing-macos
      - packages-floor
      - install-linux
      - install-windows
      - fea
      - blender
      - kicad
      - skills
      - js-core
      - js-ui
      - js-web
      - js-mcp
      - docs
      - packaging
      - viewer-e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Every job that ran passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github-workflows/ci_gate.py
