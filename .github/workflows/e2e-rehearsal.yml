name: End-to-end rehearsal

# TEMPORARY end-to-end rehearsal for pull request 739; remove this file before merging.
#
# The install, the engine and the first build, the doctor, the stop and the uninstall, on a fresh
# Windows runner and a fresh Linux runner, against the wheels this tree builds (the uvx
# bootstrap reads the library's wheel beside the server's through UV_FIND_LINKS, at the release the
# server pins, which no index has before it is released). Dispatched by hand; no test.yml job runs it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web apps/mcp
          playwright: "false"

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Build and check the wheels
        env:
          CAD_KEEP_WHEEL: "1"
          CAD_WHEEL_OUT_DIR: ${{ runner.temp }}/wheels
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      - name: Keep the wheels for the install jobs
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  windows:
    name: install, build, stop, uninstall (Windows)
    needs: wheel
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      UV_NO_MODIFY_PATH: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Take the wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: ${{ runner.temp }}\wheel

      - name: The wheel to install from, and the release it is
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem "$env:RUNNER_TEMP\wheel\cad_server-*.whl" | Select-Object -First 1).FullName
          if (-not $wheel) { throw "no server wheel in $env:RUNNER_TEMP\wheel" }
          $release = (Get-Content VERSION -Raw).Trim()
          "CAD_WHEEL=$wheel" >> $env:GITHUB_ENV
          "UV_FIND_LINKS=$env:RUNNER_TEMP\wheel" >> $env:GITHUB_ENV
          "CAD_RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "wheel: $wheel"
          Write-Host "release: $release"

      # Piped as the docs say, under Windows PowerShell 5.1 with the streams redirected as in install-windows.yml.
      - name: Install, piped as the docs say (irm | iex, 5.1)
        shell: cmd
        env:
          CAD_INSTALL_FROM: ${{ env.CAD_WHEEL }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw scripts\install\install.ps1 | Invoke-Expression" > "%RUNNER_TEMP%\install.txt" 2>&1

      - name: What the install did
        shell: pwsh
        run: |
          $out = Get-Content "$env:RUNNER_TEMP\install.txt" -Raw
          Write-Host $out
          if ($out -match 'cad setup exited') { throw "cad setup failed" }
          if ($out -notmatch "server\s+registered $([regex]::Escape($env:CAD_RELEASE))") { throw "the server did not register" }
          $cmd = Join-Path $env:USERPROFILE '.local\bin\cad.cmd'
          if (-not (Test-Path $cmd)) { throw "the cad command was not written at $cmd" }
          "CAD_CMD=$cmd" >> $env:GITHUB_ENV

      - name: Version, and status with no engine yet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:CAD_CMD --version
          if ($LASTEXITCODE) { throw "cad --version exited $LASTEXITCODE" }
          $out = (& $env:CAD_CMD status 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE) { throw "cad status exited $LASTEXITCODE" }
          if ($out -notmatch 'no engine server is running') { throw "cad status did not say no engine runs" }

      - name: The first build (starts the engine, makes the build123d base)
        shell: pwsh
        timeout-minutes: 30
        run: |
          $ErrorActionPreference = 'Continue'
          $scratch = Join-Path $env:RUNNER_TEMP 'scratch'
          New-Item -ItemType Directory -Force $scratch | Out-Null
          @'
          import build123d as bd
          from cad import model


          @model
          def box():
              body = bd.Box(20, 10, 5)
              body.label = "box"
              return body


          if __name__ == "__main__":
              box()
          '@ | Set-Content -Encoding utf8 (Join-Path $scratch 'model.py')
          Set-Location $scratch
          $out = (& $env:CAD_CMD run model.py 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE) { throw "cad run exited $LASTEXITCODE" }
          if ($out -notmatch 'built ') { throw "the build did not say it built" }
          if ($out -notmatch 'id: [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}') { throw "the build printed no document id" }

      - name: Status, with the engine running on 3245
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = (& $env:CAD_CMD status 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE) { throw "cad status exited $LASTEXITCODE" }
          if ($out -notmatch 'engine server \d+') { throw "cad status does not report a running engine" }
          $status = (& $env:CAD_CMD status --json 2>&1 | ForEach-Object { "$_" }) -join "`n" | ConvertFrom-Json
          if ($status.serving.port -ne 3245) { throw "the engine serves port $($status.serving.port), not 3245" }

      - name: The doctor and a second setup dry run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:CAD_CMD doctor
          if ($LASTEXITCODE) { throw "cad doctor exited $LASTEXITCODE" }
          $out = (& $env:CAD_CMD setup --dry-run 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $out
          if ($LASTEXITCODE) { throw "a second cad setup --dry-run exited $LASTEXITCODE" }
          if ($out -notmatch 'Dry run: nothing was changed\.') { throw "the dry run did not end as one" }

      - name: Stop, and no engine process remains
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:CAD_CMD stop
          if ($LASTEXITCODE) { throw "cad stop exited $LASTEXITCODE" }
          $left = @()
          for ($i = 0; $i -lt 30; $i++) {
            $left = @(Get-CimInstance Win32_Process -Filter "Name LIKE 'python%'" | Where-Object { $_.CommandLine -match 'cad\.engine|cad_server' })
            if (-not $left.Count) { break }
            Start-Sleep -Seconds 1
          }
          if ($left.Count) { $left | ForEach-Object { Write-Host "$($_.ProcessId) $($_.CommandLine)" }; throw "an engine process remains after cad stop" }
          Write-Host "no engine process remains"

      - name: Uninstall, through the installer (5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install\install.ps1 --from "%CAD_WHEEL%" --uninstall > "%RUNNER_TEMP%\uninstall.txt" 2>&1

      - name: What the uninstall did
        shell: pwsh
        run: |
          $out = Get-Content "$env:RUNNER_TEMP\uninstall.txt" -Raw
          Write-Host $out
          if ($out -match 'cad uninstall exited') { throw "cad uninstall failed" }
          if (Test-Path $env:CAD_CMD) { throw "the cad command is still there after the uninstall: $env:CAD_CMD" }
          Write-Host "the cad command is gone"

  linux:
    name: install, build, stop, uninstall (Linux)
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UV_NO_MODIFY_PATH: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Take the wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: ${{ runner.temp }}/wheel

      - name: The wheel to install from, and the release it is
        run: |
          wheel=$(find "$RUNNER_TEMP/wheel" -name 'cad_server-*.whl' | head -n 1)
          [ -n "$wheel" ] || { echo "no server wheel in $RUNNER_TEMP/wheel"; exit 1; }
          release=$(tr -d '[:space:]' < VERSION)
          {
            echo "CAD_WHEEL=$wheel"
            echo "UV_FIND_LINKS=$RUNNER_TEMP/wheel"
            echo "CAD_RELEASE=$release"
          } >> "$GITHUB_ENV"
          echo "wheel: $wheel"
          echo "release: $release"

      # Piped as the docs say; CAD_INSTALL_FROM is install.sh's --from, the wheel instead of PyPI.
      - name: Install, piped as the docs say (curl | sh)
        env:
          CAD_INSTALL_FROM: ${{ env.CAD_WHEEL }}
        run: |
          set -o pipefail
          cat scripts/install/install.sh | sh 2>&1 | tee "$RUNNER_TEMP/install.txt"

      - name: What the install did
        run: |
          if grep -q 'cad setup exited' "$RUNNER_TEMP/install.txt"; then echo "cad setup failed"; exit 1; fi
          grep -Eq "server +registered ${CAD_RELEASE//./\\.}" "$RUNNER_TEMP/install.txt" || { echo "the server did not register"; exit 1; }
          [ -x "$HOME/.local/bin/cad" ] || { echo "the cad command was not written at $HOME/.local/bin/cad"; exit 1; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Version, and status with no engine yet
        run: |
          cad --version
          out=$(cad status 2>&1) || { echo "cad status exited $?"; echo "$out"; exit 1; }
          echo "$out"
          echo "$out" | grep -q 'no engine server is running' || { echo "cad status did not say no engine runs"; exit 1; }

      - name: The first build (starts the engine, makes the build123d base)
        timeout-minutes: 30
        run: |
          scratch="$RUNNER_TEMP/scratch"
          mkdir -p "$scratch"
          cat > "$scratch/model.py" <<'PY'
          import build123d as bd
          from cad import model


          @model
          def box():
              body = bd.Box(20, 10, 5)
              body.label = "box"
              return body


          if __name__ == "__main__":
              box()
          PY
          cd "$scratch"
          cad run model.py 2>&1 | tee "$RUNNER_TEMP/run.txt"
          grep -q 'built ' "$RUNNER_TEMP/run.txt" || { echo "the build did not say it built"; exit 1; }
          grep -Eq 'id: [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' "$RUNNER_TEMP/run.txt" || { echo "the build printed no document id"; exit 1; }

      - name: Status, with the engine running on 3245
        run: |
          cad status | tee "$RUNNER_TEMP/status.txt"
          grep -Eq 'engine server [0-9]+' "$RUNNER_TEMP/status.txt" || { echo "cad status does not report a running engine"; exit 1; }
          port=$(cad status --json | jq -r '.serving.port')
          [ "$port" = "3245" ] || { echo "the engine serves port $port, not 3245"; exit 1; }

      - name: The doctor and a second setup dry run
        run: |
          cad doctor
          cad setup --dry-run | tee "$RUNNER_TEMP/dry-run.txt"
          grep -q 'Dry run: nothing was changed\.' "$RUNNER_TEMP/dry-run.txt" || { echo "the dry run did not end as one"; exit 1; }

      - name: Stop, and no engine process remains
        run: |
          cad stop
          for _ in $(seq 30); do
            if ! pgrep -f cad_server >/dev/null && ! pgrep -f "cad.engine" >/dev/null; then break; fi
            sleep 1
          done
          if pgrep -fa cad_server || pgrep -fa "cad.engine"; then echo "an engine process remains after cad stop"; exit 1; fi
          echo "no engine process remains"

      - name: Uninstall, through the installer
        run: |
          set -o pipefail
          sh scripts/install/install.sh --from "$CAD_WHEEL" --uninstall 2>&1 | tee "$RUNNER_TEMP/uninstall.txt"
          if grep -q 'cad uninstall exited' "$RUNNER_TEMP/uninstall.txt"; then echo "cad uninstall failed"; exit 1; fi
          if [ -e "$HOME/.local/bin/cad" ]; then echo "the cad command is still there after the uninstall"; exit 1; fi
          echo "the cad command is gone"
