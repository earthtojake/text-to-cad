name: Publish Release

# A release is the commit that moves VERSION. The pull request that carries it bumps
# VERSION, the derived metadata and every cadgen pin in one step
# (scripts/release/bump-version.sh); Test's Version Check vets the bump, and a VERSION change
# selects every Test job. Merging that pull request is the push that starts this workflow:
# only a push that changes VERSION does.
#
# Nothing ships untested, and nothing is tested twice. Every Test run records the tree it
# tested (scripts/github-workflows/select_checks.py, tested_tree.py). main merges a pull
# request only once it is up to date, so the release commit's tree is normally the tree its
# pull request's run tested in full; the gate looks that record up, and the tests do not run
# again. Without one -- an admin merge, a direct push, a branch merged behind main -- this
# workflow runs every Test job on the release commit before anything is built.
#
# Then the publish job builds what ships from that commit -- the plugin ZIP, the runtime
# bundle, the wheel and sdist -- and installs and exercises the wheel it is about to upload.
# The IRREVERSIBLE steps -- PyPI upload, docs deploy, tag + GitHub Release, plugin branch --
# run only on refs/heads/main. build-test is the rehearsal branch: there the run prints what
# it would have uploaded, deployed and tagged, and stops.
#
# Manual dispatch resumes: it publishes the commit on the dispatched branch that last moved
# VERSION, if that version has no tag yet. A run that uploaded the wheel and died before the
# tag is finished this way (PyPI's skip-existing makes the re-upload a no-op).
#
# Release tags are `v<VERSION>` from 0.5.0 on; earlier releases were tagged bare
# (`0.4.28`). scripts/release/release-tags.sh is the one place that knows both.

on:
  push:
    branches:
      - main
      - build-test
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the GitHub Release (main only). Set to false to leave it as a draft.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# One release at a time per branch. A run waiting here is replaced by a newer one, which is
# why only a push that moves VERSION starts this workflow at all: an ordinary merge can never
# cancel a release that is waiting its turn.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # tested_tree.py reads other runs' records.
      actions: read
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
      release_sha: ${{ steps.release.outputs.sha }}
      is_main: ${{ steps.gate.outputs.is_main }}
      tested: ${{ steps.tested.outputs.tested }}

    steps:
      - name: Check out the branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A push is the release commit itself. A dispatch publishes the commit that last moved
      # VERSION on the dispatched branch: later merges ride in the next release, not this one.
      - name: Find the release commit
        id: release
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            sha="$GITHUB_SHA"
          else
            sha="$(git log -1 --first-parent --format=%H -- VERSION)"
          fi
          git checkout --quiet --detach "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release commit: $sha"

      - name: Check canonical release version
        run: scripts/release/check-version.sh

      # Publish only a version that is past the latest release tag (either spelling). That
      # covers a resume too: a run that uploaded the wheel and died before tagging left the
      # tag missing, so its version is still past the latest one. On build-test the same
      # comparison runs against the same real tags.
      - name: Evaluate release gate
        id: gate
        run: |
          current_version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
            echo "Rehearsal on $GITHUB_REF_NAME: the irreversible steps (PyPI, docs, tag) are skipped."
          fi
          latest_tag="$(source scripts/release/release-tags.sh && latest_release_tag)"
          if [ -z "$latest_tag" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "No release tag yet; publishing $current_version."
          elif scripts/release/check-version.sh --incremented-from "refs/tags/$latest_tag"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Release version $current_version is past $latest_tag; publishing."
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to publish: version $current_version is not past $latest_tag."
          fi

      # The record a Test run made of exactly this tree with every job selected. Not finding
      # one -- or failing to look -- means the tests run below.
      - name: Find the run that tested this tree
        id: tested
        if: steps.gate.outputs.should_publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          record="tested-$(git rev-parse 'HEAD^{tree}')-full"
          if python3 scripts/github-workflows/tested_tree.py "$record"; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "tested=false" >> "$GITHUB_OUTPUT"
            echo "Every Test job runs on the release commit before it is built."
          fi

  # Every Test job, on the release commit, when no run tested its tree in full.
  test:
    name: Test
    needs: gate
    if: needs.gate.outputs.should_publish == 'true' && needs.gate.outputs.tested != 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/test.yml
    with:
      full: true
      ref: ${{ needs.gate.outputs.release_sha }}

  publish:
    name: Publish
    needs:
      - gate
      - test
    # `test` is skipped when the gate found the tree tested; anything else but success stops here.
    if: ${{ !cancelled() && needs.gate.outputs.should_publish == 'true' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.gate.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Trusted publishing (OIDC) for the PyPI upload.
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The plugin as OpenAI's plugin submission portal takes it, built from the release
      # commit before anything else in this run touches the tree. It is checked against
      # the portal's package rules here, ahead of every irreversible step: a package the
      # portal would refuse stops the release before PyPI, not after it. The portal has
      # no API, so a person uploads this file (CONTRIBUTING.md, Releases); tag-release
      # attaches these same bytes to the GitHub Release.
      - name: Build the OpenAI plugin ZIP
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/release/plugin_zip.py --out "$RUNNER_TEMP/plugin/cad-openai-plugin-$VERSION.zip"

      - name: Upload the OpenAI plugin ZIP as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: cad-openai-plugin-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/plugin/
          if-no-files-found: error

      # The plugin as the directories take it (manifests, icon, skills, LICENSE, README),
      # checked against claude.ai's file rules ahead of every irreversible step; on main,
      # plugin-branch below commits this same tree to the branch.
      - name: Check the plugin tree
        run: python3 scripts/release/plugin_branch.py --check

      # What the build needs and nothing the tests need: the CAD dependencies the wheel's
      # install test reuses, and the workspaces the bundle builds (core, ui, the web client,
      # the CAD app). No browsers -- nothing here renders.
      - name: Set up dependencies
        uses: ./.github/actions/setup-deps
        with:
          playwright: "false"
          npm: packages/core packages/ui apps/web apps/mcp

      # The bundle feeds the WHEEL, and it is the only thing that does: cadgen's Node
      # builders, the snapshot browser bundle, the CAD Viewer client, the CAD app and the
      # file tracers are all gitignored, so the release commit carries none of them. Nothing
      # here writes to git -- the wheel is the release asset.
      - name: Bundle production outputs
        run: scripts/bundle/bundle.sh --clean

      - name: Validate production bundle layout
        run: scripts/github-workflows/check-builds.sh --skip-bundle-check

      - name: Check cadgen package version matches the canonical release version
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if ! grep -Eq "^version = \"$version\"$" packages/cadgen/pyproject.toml; then
            echo "packages/cadgen/pyproject.toml version does not match VERSION ($version)." >&2
            exit 1
          fi

      # Package data fails quietly: a glob that stops matching produces a wheel that
      # imports fine and cannot build a DXF preview or serve the Viewer.
      - name: Check cadgen wheel contents
        run: |
          python -m pip install build
          scripts/release/check-wheel-contents.sh

      - name: Build cadgen sdist and wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build packages/cadgen

      # The wheel that is about to ship, installed into a fresh venv with no repo on
      # the path: the front door, the viewer verb and the skill pin check all answer.
      # test-installed.sh then drives the same wheel through a real build.
      - name: Install the built wheel and exercise it
        run: |
          wheel="$(find packages/cadgen/dist -name '*.whl' -type f | head -n 1)"
          [ -n "$wheel" ] || { echo "no wheel under packages/cadgen/dist" >&2; exit 1; }
          python3 -m venv "$RUNNER_TEMP/install-test"
          "$RUNNER_TEMP/install-test/bin/python" -m pip install --quiet --no-deps "$wheel"
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/install-test/bin/cadgen" --help >/dev/null)
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/install-test/bin/cadgen" viewer --help >/dev/null)
          "$RUNNER_TEMP/install-test/bin/cadgen" doctor skills/cad
          scripts/test/test-installed.sh --wheel "$wheel"

      # The paranoid half of the same question check-wheel-contents.sh answers, asked of
      # the wheel that actually ships rather than one rebuilt in scratch: the runtime is
      # built minutes earlier by a step that could fail soft, and a wheel without it
      # installs cleanly and then cannot render a snapshot or export a mesh.
      - name: Assert the shipping wheel carries its built runtime
        run: |
          wheel="$(find packages/cadgen/dist -name '*.whl' -type f | head -n 1)"
          [ -n "$wheel" ] || { echo "no wheel under packages/cadgen/dist" >&2; exit 1; }
          listing="$(unzip -l "$wheel")"
          echo "$listing" | grep -E 'cadgen/_runtime/' || true
          for required in \
            cadgen/_runtime/browser/snapshot-render.js \
            cadgen/_runtime/browser/render.html \
            cadgen/_runtime/node/mesh-export.mjs \
            cadgen/_runtime/viewer/index.html \
            cadgen/_runtime/mcp/index.html \
            cadgen/_runtime/native/filetrace-macos-aarch64.dylib \
            cadgen/_runtime/native/filetrace-macos-x86_64.dylib \
            cadgen/_runtime/native/filetrace-linux-x86_64.so \
            cadgen/_runtime/native/filetrace-linux-aarch64.so \
            cadgen/_runtime/native/filetrace-windows-x86_64.dll; do
            if ! printf '%s\n' "$listing" | grep -qF " $required"; then
              echo "$(basename "$wheel") does not contain $required" >&2
              echo "scripts/bundle/bundle.sh produces it; [tool.setuptools.package-data] ships it." >&2
              exit 1
            fi
          done
          echo "$(basename "$wheel") carries its built runtime."

      # The distribution is kept whether or not it ships: a rehearsal's artifact is
      # what you inspect instead of a PyPI upload, and a main run's is the record of
      # exactly what was uploaded.
      - name: Upload the distribution as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: cadgen-${{ needs.gate.outputs.version }}
          path: packages/cadgen/dist/*
          if-no-files-found: error

      # ---- irreversible from here: main only -------------------------------------

      # Uploaded BEFORE the tag: the skill pins on main name this version, so a tagged
      # release without its wheel would break every skill install. If the upload
      # succeeds and a later step fails, dispatch this workflow on main again.
      - name: Publish cadgen to PyPI
        if: needs.gate.outputs.is_main == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/cadgen/dist
          skip-existing: true

      - name: Rehearsal summary (build-test)
        if: needs.gate.outputs.is_main != 'true'
        run: |
          echo "Rehearsal complete on $GITHUB_REF_NAME at ${{ needs.gate.outputs.release_sha }}."
          echo "Would have uploaded: $(ls packages/cadgen/dist)"
          echo "Would have deployed the docs site from ${{ needs.gate.outputs.release_sha }}."
          echo "Would have committed the plugin tree to the plugin branch."
          # --dry-run computes the tag and the release it would create without
          # pushing anything; the version check inside it runs for real.
          args=(--target HEAD --dry-run --publish)
          for file in packages/cadgen/dist/* "$RUNNER_TEMP"/plugin/*.zip; do args+=(--asset "$file"); done
          scripts/release/publish-github-release.sh "${args[@]}"

  # The docs site is built from the release commit itself: main is the source tree,
  # and apps/docs/package.json carries the stamped version the header reads.
  deploy-docs:
    name: Deploy Docs
    needs:
      - gate
      - publish
    # Spelled out: the implicit success() would also read `test`, skipped when the tree was tested.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.gate.outputs.is_main == 'true' }}
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.gate.outputs.release_sha }}
    secrets: inherit

  # claude.ai's plugin directory follows the `plugin` branch: one commit per release whose
  # tree is only the plugin, so it never scans or installs the rest of the monorepo. Every
  # other store reads `main` or the release; Publish Release is the branch's only writer.
  #
  # TODO: claude.ai's listing still tracks `claude-plugin`, the branch's old name, and
  # the portal refuses a tracked-branch change while a reviewer has the plugin. Until the
  # listing's Settings tab is switched to `plugin`, the same commit goes to both; then
  # drop the `claude-plugin` push and delete that branch (CONTRIBUTING.md, Releases).
  plugin-branch:
    name: Plugin branch
    needs:
      - gate
      - publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.gate.outputs.is_main == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          persist-credentials: false

      - name: Commit the plugin onto plugin (and claude-plugin) and push it
        env:
          PUBLISH_PUSH_TOKEN: ${{ secrets.PUBLISH_PUSH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          remote="https://x-access-token:${PUBLISH_PUSH_TOKEN:-$GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          parent=""
          # The first release after the rename builds on claude-plugin, so both names share history.
          for branch in plugin claude-plugin; do
            if git fetch --quiet "$remote" "+refs/heads/$branch:refs/remotes/origin/$branch"; then
              parent="$(git rev-parse "refs/remotes/origin/$branch")"
              break
            fi
          done
          [ -n "$parent" ] || echo "No plugin branch yet; this release creates it."
          commit="$(python3 scripts/release/plugin_branch.py --commit --parent "$parent")"
          # A push that changes nothing is a no-op, so an unchanged plugin still leaves both names on it.
          git push "$remote" "$commit:refs/heads/plugin" "$commit:refs/heads/claude-plugin"

  tag-release:
    name: Tag and GitHub Release
    # The tag records what was published; a docs deploy failing must not leave a
    # PyPI release untagged (Deploy Docs can be re-run on its own).
    needs:
      - gate
      - publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.gate.outputs.is_main == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure tag push credentials
        env:
          PUBLISH_PUSH_TOKEN: ${{ secrets.PUBLISH_PUSH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$PUBLISH_PUSH_TOKEN" ]; then
            git remote set-url origin "https://x-access-token:${PUBLISH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using PUBLISH_PUSH_TOKEN for tag push."
          else
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Using GITHUB_TOKEN for tag push."
          fi

      # The distribution this run built and uploaded to PyPI, fetched back from the
      # workflow artifact so the release page carries the same bytes -- not a
      # rebuild, which could legally differ.
      - name: Download the published distribution
        uses: actions/download-artifact@v8
        with:
          name: cadgen-${{ needs.gate.outputs.version }}
          path: packages/cadgen/dist

      # The plugin ZIP the publish job built and checked from this same commit.
      - name: Download the OpenAI plugin ZIP
        uses: actions/download-artifact@v8
        with:
          name: cad-openai-plugin-${{ needs.gate.outputs.version }}
          path: ${{ runner.temp }}/plugin

      # A push-triggered run has no `publish` input: it publishes. Only a manual
      # dispatch can ask for a draft. The wheel, sdist and plugin ZIP are attached to
      # the release; a resumed run attaches them to the release that already exists.
      - name: Create release tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--target HEAD)
          if [ "${INPUT_PUBLISH:-true}" = "true" ]; then
            args+=(--publish)
          fi
          ls -l packages/cadgen/dist "$RUNNER_TEMP/plugin"
          for file in packages/cadgen/dist/*.whl packages/cadgen/dist/*.tar.gz "$RUNNER_TEMP"/plugin/*.zip; do
            [ -f "$file" ] && args+=(--asset "$file")
          done
          scripts/release/publish-github-release.sh "${args[@]}"
