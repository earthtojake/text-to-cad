# TEMPORARY: an end-to-end check that the release's PostHog secrets work, run once on this branch and then removed.
# Prints no secret: only names and HTTP statuses.
name: PostHog E2E (temporary)

on:
  push:
    branches: [claude/determined-edison-yo8g4u]
    paths: [.github/workflows/posthog-e2e.yml]

permissions:
  contents: read

jobs:
  sourcemaps:
    name: Source maps reach PostHog with the release's secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
      POSTHOG_CLI_PROJECT_ID: ${{ secrets.POSTHOG_CLI_PROJECT_ID }}
      POSTHOG_CLI_HOST: ${{ secrets.POSTHOG_CLI_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The three secrets are set
        run: |
          missing=0
          for name in POSTHOG_CLI_API_KEY POSTHOG_CLI_PROJECT_ID POSTHOG_CLI_HOST; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; else echo "$name is set"; fi
          done
          case "$POSTHOG_CLI_HOST" in https://us.posthog.com|https://eu.posthog.com) echo "POSTHOG_CLI_HOST is $POSTHOG_CLI_HOST" ;;
            *) echo "::warning::POSTHOG_CLI_HOST is neither https://us.posthog.com nor https://eu.posthog.com" ;; esac
          [ "$missing" = 0 ]
      - name: The key opens the project's error tracking
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $POSTHOG_CLI_API_KEY" \
            "$POSTHOG_CLI_HOST/api/environments/$POSTHOG_CLI_PROJECT_ID/error_tracking/symbol_sets/?limit=1")"
          echo "GET error_tracking/symbol_sets -> $status"
          [ "$status" = 200 ]
      - uses: ./.github/actions/setup-deps
        with:
          python: "false"
          playwright: "false"
          npm: packages/core packages/ui apps/web apps/mcp
      - name: Build both pages
        run: |
          npm run build:packages
          npm --prefix apps/web run build
          npm --prefix apps/mcp run build
      - name: Collect, as the release does
        run: python3 scripts/release/sourcemaps.py collect --out "$RUNNER_TEMP/sourcemaps/files"
      - name: Upload, as the release does, and no two chunks share an id
        run: |
          npx --yes @posthog/cli@0.18.9 sourcemap upload --directory "$RUNNER_TEMP/sourcemaps/files" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          if grep -q "Duplicate chunk id" "$RUNNER_TEMP/upload.log"; then echo "::error::posthog-cli kept one map for two chunks"; exit 1; fi
      - name: Every chunk's map is filed in PostHog under its debug id
        run: |
          missing=0
          checked=0
          for map in "$RUNNER_TEMP"/sourcemaps/files/*/*.js.map; do
            id="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["debugId"])' "$map")"
            found="$(curl -sS -H "Authorization: Bearer $POSTHOG_CLI_API_KEY" \
              "$POSTHOG_CLI_HOST/api/environments/$POSTHOG_CLI_PROJECT_ID/error_tracking/symbol_sets/?ref=$id&limit=1" |
              python3 -c 'import json, sys; print(len(json.load(sys.stdin).get("results", [])))')"
            checked=$((checked + 1))
            [ "$found" = 1 ] || { echo "not filed: $(basename "$map") ($id)"; missing=$((missing + 1)); }
          done
          echo "checked $checked maps, $missing not filed"
          [ "$missing" = 0 ]
