name: Windows installer rehearsal

# install.ps1 on a fresh Windows runner, the way a person runs it: Windows PowerShell 5.1, the piped `irm | iex`
# form, against the wheels this tree builds, written again as a release no index holds, this tree's major and
# minor with a patch far above PyPI's newest (scripts/test/real_computer.py stamp and publish), and offered to uv
# (UV_FIND_LINKS): the install command's `uv tool install cad`, which installs the newest release uv is offered,
# takes them, never an index's. uv installed by its own installer when the image has none; cad a uv tool, its
# cad.exe in ~\.local\bin, cad's automatic updates on and the plugin's turned on by the install, no server
# started; the doctor; the command again, in a PowerShell that has been used ("installed already"); then models
# built on it (a box, a box with a hand-made wheel through `--with`, by a version range on the command line,
# through a script's header, from a venv of the user's own with the library installed, and the page link's
# token), arguments cmd would have parsed, a state folder named with accents and a non-Latin script, and
# `uv tool uninstall cad`. test.yml calls it, as it does the Linux one, on a full run (so before a release
# ships) and on a change to the installers: the selector's `installer` flag
# (scripts/github-workflows/select_checks.py). Dispatched by hand with `published`, the same steps run against
# what people install today: the docs site's install.ps1 and PyPI's newest release of cad, no wheel built.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The ref to rehearse (default: the branch dispatched)"
        required: false
        default: ""
      published:
        description: "Rehearse the published release (the site's install.ps1, PyPI), not this tree's wheel"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      ref:
        description: "The ref to rehearse (default: the caller's commit)"
        type: string
        required: false
        default: ""
      published:
        description: "Rehearse the published release (the site's install.ps1, PyPI), not this tree's wheel"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  wheel:
    name: wheel
    if: ${{ !inputs.published }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up dependencies
        timeout-minutes: 10
        uses: ./.github/actions/setup-deps
        with:
          npm: packages/core packages/ui apps/web apps/mcp
          playwright: "false"

      - name: Bundle production outputs from clean
        run: scripts/bundle/bundle.sh --clean

      - name: Build and check the wheels
        timeout-minutes: 10
        env:
          CAD_KEEP_WHEEL: "1"
          CAD_WHEEL_OUT_DIR: ${{ runner.temp }}/wheels
        run: scripts/release/check-wheel-contents.sh

      - name: Keep the wheels for the Windows job
        uses: actions/upload-artifact@v7
        with:
          name: install-windows-wheels
          path: ${{ runner.temp }}/wheels/*.whl
          if-no-files-found: error
          retention-days: 1

  windows:
    name: install.ps1 (Windows PowerShell 5.1)
    needs: wheel
    if: ${{ !cancelled() && needs.wheel.result != 'failure' }}
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      UV_NO_MODIFY_PATH: "1"
      CAD_PUBLISHED: ${{ inputs.published }}
      # The installer read and handed to Invoke-Expression, as the docs say.
      CAD_PIPED: ${{ inputs.published && 'irm https://www.texttocad.dev/install.ps1' || 'Get-Content -Raw scripts\install\install.ps1' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Take the wheel
        if: ${{ !inputs.published }}
        uses: actions/download-artifact@v8
        with:
          name: install-windows-wheels
          path: ${{ runner.temp }}\wheel

      # This tree's wheels as a release newer than PyPI's newest, offered to uv; this tree's install.py.
      # Published: the site's installer, and PyPI's newest release, which is what it installs.
      - name: The release to install, and the wheels that carry it
        shell: pwsh
        run: |
          if ($env:CAD_PUBLISHED -eq 'true') {
            $release = (Invoke-RestMethod https://pypi.org/pypi/cad/json).info.version
            if (-not $release) { throw "PyPI names no release of cad" }
            New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\wheel" | Out-Null
          } else {
            # All it prints, then the first line: a pipeline cut at its first line (Select-Object -First 1) can end
            # the program early, and $LASTEXITCODE is then not its status (install.ps1's Get-UvVersion says how).
            $release = @(python scripts/test/real_computer.py stamp)[0]
            if ($LASTEXITCODE -or -not $release) { throw "the release to stamp the wheels with: exit $LASTEXITCODE" }
            python scripts/test/real_computer.py publish "$env:RUNNER_TEMP\wheel" $release "$env:RUNNER_TEMP\stamped"
            if ($LASTEXITCODE) { throw "writing the wheels again as $release exited $LASTEXITCODE" }
            "CAD_INSTALL_PY=$PWD\scripts\install\install.py" >> $env:GITHUB_ENV
            "UV_FIND_LINKS=$env:RUNNER_TEMP\stamped" >> $env:GITHUB_ENV
          }
          "CAD_RELEASE=$release" >> $env:GITHUB_ENV
          Write-Host "release: $release"
          if (Get-Command uv -ErrorAction SilentlyContinue) {
            Write-Host "uv is on this image already: the bootstrap's own install of uv is not exercised here"
          } else {
            Write-Host "no uv on this image: the bootstrap installs it with uv's installer"
          }

      - name: Install, piped as the docs say (irm | iex, 5.1)
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -Command "%CAD_PIPED% | Invoke-Expression" > "%RUNNER_TEMP%\install.txt" 2>&1

      - name: What the install did
        shell: pwsh
        run: |
          $out = Get-Content "$env:RUNNER_TEMP\install.txt" -Raw
          Write-Host $out
          if ($out -match '(?m)^cad: (failed|not installed)') { throw "cad was not installed" }
          if ($out -notmatch '(?m)^Installing cad with uv\. ') { throw "the install command did not install cad" }
          $cmd = Join-Path $env:USERPROFILE '.local\bin\cad.exe'
          if (-not (Test-Path $cmd)) { throw "uv wrote no cad command at $cmd" }
          if (Test-Path (Join-Path $env:USERPROFILE '.local\bin\cad-launcher')) { throw "a cad-launcher folder was written" }
          if (Test-Path (Join-Path $env:USERPROFILE '.local\bin\cad.cmd')) { throw "a cad.cmd was written beside cad.exe" }
          "CAD_CMD=$cmd" >> $env:GITHUB_ENV

      # cad at the stamped release, both switches on (cad's own by default, the plugin's by the install), no server
      # started by the install, the doctor's verdict, then the command again: quick and harmless, cad is installed
      # already.
      - name: The cad command, its switches, the doctor and the install command again
        shell: pwsh
        run: |
          $said = @(& $env:CAD_CMD --version)[0]
          if ($LASTEXITCODE) { throw "cad --version exited $LASTEXITCODE" }
          if ($said -ne "cad $env:CAD_RELEASE") { throw "cad --version said '$said', not 'cad $env:CAD_RELEASE'" }
          $switches = (@(& $env:CAD_CMD update auto status) + @(& $env:CAD_CMD plugin update auto status)) -join "`n"
          if ($switches -ne "update auto: on`nplugin update auto: on") { throw "cad update auto status and cad plugin update auto status said: $switches" }
          $status = (& $env:CAD_CMD server status --json) -join ''
          if ($status.Trim() -ne 'null') { throw "the install started a server: $status" }
          & $env:CAD_CMD doctor
          if ($LASTEXITCODE) { throw "cad doctor exited $LASTEXITCODE" }
          # Again in a PowerShell that has been used, as a person's window has: a program through a pipeline cut at
          # its first line runs first. From the second such pipeline on, Windows PowerShell 5.1 gives -1 as the
          # program's exit status; the first in a new PowerShell, every other run here, usually gets 0. install.ps1
          # once read uv's version that way: a current uv was "of an unknown version", and the install stopped.
          $again = (powershell -NoProfile -ExecutionPolicy Bypass -Command "cmd /c ver | Select-Object -First 1 | Out-Null; $env:CAD_PIPED | Invoke-Expression" 2>&1 | ForEach-Object { "$_" }) -join "`n"
          Write-Host $again
          if ($LASTEXITCODE) { throw "the install command again exited $LASTEXITCODE" }
          if ($again -notmatch "cad $([regex]::Escape($env:CAD_RELEASE)) is installed already") { throw "the install command again did not find cad installed" }

      # What the model steps share: run a program and keep its stdout and stderr together (Windows
      # PowerShell 5.1 turns a native command's stderr lines into error records, so they are
      # stringified here, and the checks throw on their own); write a file without a byte-order mark.
      - name: The helpers the model steps use
        shell: pwsh
        run: |
          $helpers = @'
          $ErrorActionPreference = 'Continue'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          function Save([string]$Path, [string]$Text) {
            New-Item -ItemType Directory -Force (Split-Path $Path) | Out-Null
            [IO.File]::WriteAllText($Path, $Text, $utf8)
          }
          function Fail([string]$Message) { Write-Host "::error::$Message"; throw $Message }
          function Invoke-Native {
            $exe = $args[0]
            $rest = @($args | Select-Object -Skip 1)   # an array: one argument splatted as a string would be taken by its characters
            $lines = @(& $exe @rest 2>&1 | ForEach-Object { "$_" })
            $code = $LASTEXITCODE
            $text = $lines -join "`n"
            Write-Host $text
            [pscustomobject]@{ Code = $code; Text = $text }
          }
          function Invoke-Cad { Invoke-Native $env:CAD_CMD @args }
          function Need($Result, [string]$What, [string[]]$Patterns) {
            if ($Result.Code -ne 0) { Fail "$What exited $($Result.Code)" }
            foreach ($pattern in $Patterns) {
              if ($Result.Text -notmatch $pattern) { Fail "${What}: the output lacks /$pattern/" }
            }
          }
          function Find-Uv {
            $command = Get-Command uv -ErrorAction SilentlyContinue
            if ($command) { return $command.Source }
            $folders = @($env:UV_INSTALL_DIR, (Join-Path $env:USERPROFILE '.local\bin'), (Join-Path $env:USERPROFILE '.cargo\bin'))
            if ($env:UV_INSTALL_DIR) { $folders += (Join-Path $env:UV_INSTALL_DIR 'bin') }
            foreach ($folder in $folders) {
              if ($folder -and (Test-Path (Join-Path $folder 'uv.exe'))) { return (Join-Path $folder 'uv.exe') }
            }
            Fail "uv was not found on PATH or where its installer puts it"
          }
          '@
          Set-Content -Path "$env:RUNNER_TEMP\e2e.ps1" -Value $helpers -Encoding utf8

      # 1. A model builds: the output says `built ` and the bounds. The first build also makes the
      # CAD kernel environment, once (minutes).
      - name: cad run, a box (5.1)
        shell: powershell
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          $dir = Join-Path $env:RUNNER_TEMP 'models\box'
          Save "$dir\box.py" @'
          from cad import model


          @model
          def box():
              import build123d as bd

              return bd.Box(40, 20, 6)


          if __name__ == "__main__":
              box()
          '@
          Set-Location $dir
          $r = Invoke-Cad server start
          Need $r 'cad server start' @("cad $([regex]::Escape($env:CAD_RELEASE))")
          $r = Invoke-Cad run box.py
          Need $r 'cad run box.py' @('(?m)^built \S+', 'bounds 40\D+20\D+6 mm')
          Save "$env:RUNNER_TEMP\box-output.txt" $r.Text

      # 2. A hand-made wheel through --with: the model imports it, and a second run is warm.
      - name: Make a local wheel, own-extra 1.0
        shell: pwsh
        run: |
          $maker = @'
          import base64, hashlib, sys, zipfile
          from pathlib import Path

          out = Path(sys.argv[1])
          out.mkdir(parents=True, exist_ok=True)
          info = "own_extra-1.0.dist-info"
          files = {
              "own_extra/__init__.py": b"WIDTH = 33.0\n",
              info + "/METADATA": b"Metadata-Version: 2.1\nName: own-extra\nVersion: 1.0\n",
              info + "/WHEEL": b"Wheel-Version: 1.0\nGenerator: rehearsal\nRoot-Is-Purelib: true\nTag: py3-none-any\n",
          }


          def digest(data):
              return "sha256=" + base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b"=").decode()


          record = "".join(f"{name},{digest(data)},{len(data)}\n" for name, data in files.items())
          wheel = out / "own_extra-1.0-py3-none-any.whl"
          with zipfile.ZipFile(wheel, "w") as archive:
              for name, data in files.items():
                  archive.writestr(name, data)
              archive.writestr(info + "/RECORD", record + info + "/RECORD,,\n")
          print(wheel)
          '@
          Set-Content -Path "$env:RUNNER_TEMP\make_wheel.py" -Value $maker -Encoding utf8
          python "$env:RUNNER_TEMP\make_wheel.py" "$env:RUNNER_TEMP\own"
          if ($LASTEXITCODE) { throw "making the wheel exited $LASTEXITCODE" }
          $wheel = Join-Path $env:RUNNER_TEMP 'own\own_extra-1.0-py3-none-any.whl'
          if (-not (Test-Path $wheel)) { throw "no wheel at $wheel" }
          "OWN_WHEEL=$wheel" >> $env:GITHUB_ENV
          "OWN_WHEEL_URL=file:///$($wheel -replace '\\', '/')" >> $env:GITHUB_ENV

      - name: cad run --with the wheel, twice (5.1)
        shell: powershell
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          $dir = Join-Path $env:RUNNER_TEMP 'models\with'
          Save "$dir\strip.py" @'
          import own_extra
          from cad import model


          @model
          def strip():
              import build123d as bd

              return bd.Box(own_extra.WIDTH, 20, 4)


          if __name__ == "__main__":
              strip()
          '@
          Set-Location $dir
          $first = Invoke-Cad run --with $env:OWN_WHEEL strip.py
          Need $first 'cad run --with the wheel' @('(?m)^built \S+', 'bounds 33\D+20\D+4 mm')
          $again = Invoke-Cad run --with $env:OWN_WHEEL strip.py
          Need $again 'the second cad run --with' @('(?m)^(built|took) \S+ warm', 'bounds 33\D+20\D+4 mm')
          if ($again.Text -match '(?m)^(built|took) \S+ cold') { Fail "the second run was cold" }

      # 2b. A version range on the command line: Windows PowerShell 5.1 passes `own-extra>=1.0`
      # unquoted, as it passes any argument without a space. cad.cmd handed it to cmd, which read `>` as
      # a redirection (it installed `own-extra` and wrote a file named `=1.0`); cad.exe hands it to
      # Python as it is. Then arguments cmd would have parsed -- `&`, `^`, `!`, `%PATH%`, `<`, `>`, `|` --
      # come back unchanged in cad's own error, with and without a space.
      - name: Arguments reach cad as given (5.1)
        shell: powershell
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          # The wheel beside cad's (UV_FIND_LINKS): a requirement by name and range finds it there.
          Copy-Item -LiteralPath $env:OWN_WHEEL -Destination "$env:RUNNER_TEMP\stamped" -Force
          $dir = Join-Path $env:RUNNER_TEMP 'models\ranged'
          Save "$dir\strip.py" @'
          import own_extra
          from cad import model


          @model
          def ranged():
              import build123d as bd

              return bd.Box(own_extra.WIDTH, 20, 3)


          if __name__ == "__main__":
              ranged()
          '@
          Set-Location $dir
          $r = Invoke-Cad run --with "own-extra>=1.0" strip.py
          Need $r 'cad run --with "own-extra>=1.0"' @('(?m)^(built|took) \S+', 'bounds 33\D+20\D+3 mm')
          if (Test-Path -LiteralPath (Join-Path $dir '=1.0')) { Fail "the requirement was redirected: a file named =1.0" }
          foreach ($odd in @('a&b^c!d!%PATH%<e>f|g', 'x & y ^ !z! %PATH% > w')) {
            $r = Invoke-Cad $odd
            if ($r.Code -ne 2) { Fail "cad $odd exited $($r.Code), not 2 (an unknown command)" }
            if ($r.Text.IndexOf("cad: unknown command '$odd'") -lt 0) { Fail "cad did not receive $odd as given" }
          }
          # What cmd would have made of them: files named by what followed each >.
          foreach ($name in @('f', 'w')) {
            if (Test-Path -LiteralPath (Join-Path $dir $name)) { Fail "an argument was redirected: a file named $name" }
          }
          Write-Host "every argument arrived as given; nothing was redirected"
          exit 0  # the runner exits with the last native exit status: here cad's 2, which the checks expected

      # 3. The same wheel named in the script's own header: plain `cad run` builds it.
      - name: cad run, a header naming the wheel (5.1)
        shell: powershell
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          $dir = Join-Path $env:RUNNER_TEMP 'models\header'
          $header = "# /// script`n# dependencies = [`"own-extra @ $env:OWN_WHEEL_URL`"]`n# ///`n"
          Save "$dir\headed.py" ($header + @'
          import own_extra
          from cad import model


          @model
          def headed():
              import build123d as bd

              return bd.Box(own_extra.WIDTH, 20, 5)


          if __name__ == "__main__":
              headed()
          '@)
          Set-Location $dir
          $r = Invoke-Cad run headed.py
          Need $r 'cad run headed.py' @('(?m)^(built|took) \S+', 'bounds 33\D+20\D+5 mm')

      # 4. Option B: the user's own venv holds the library and their package; running its Python on
      # a model builds through the device's installed server, and `cad status` names that Python.
      - name: A venv of the user's own (uv, Python 3.14), a model run by its Python (5.1)
        shell: powershell
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          $uv = Find-Uv
          $venv = Join-Path $env:RUNNER_TEMP 'optionb-venv'
          $r = Invoke-Native $uv venv --python 3.14 $venv
          if ($r.Code) { Fail "uv venv exited $($r.Code)" }
          $py = Join-Path $venv 'Scripts\python.exe'
          $r = Invoke-Native $uv pip install --python $py --find-links "$env:RUNNER_TEMP\stamped" "cad[build123d]==$env:CAD_RELEASE" $env:OWN_WHEEL
          if ($r.Code) { Fail "uv pip install exited $($r.Code)" }
          $dir = Join-Path $env:RUNNER_TEMP 'models\venv'
          Save "$dir\model.py" @'
          import own_extra
          from cad import model


          @model
          def viaenv():
              import build123d as bd

              return bd.Box(own_extra.WIDTH, 20, 4)


          if __name__ == "__main__":
              viaenv()
          '@
          Set-Location $dir
          $r = Invoke-Native $py model.py
          Need $r 'the venv Python on model.py' @('(?m)^built \S+', 'bounds 33\D+20\D+4 mm')
          $status = Invoke-Cad status
          if ($status.Code) { Fail "cad status exited $($status.Code)" }
          if ($status.Text.IndexOf($py, [StringComparison]::OrdinalIgnoreCase) -lt 0) {
            Fail "cad status does not name the venv's Python, $py"
          }

      # 5. The page link of a build (step 1's) opens with its token and is refused without it.
      - name: The page link and its token
        shell: powershell
        timeout-minutes: 5
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          $out = Get-Content "$env:RUNNER_TEMP\box-output.txt" -Raw
          if ($out -notmatch '(?m)^\s*view:\s+(http://\S+\?token=\S+)') { Fail "the build printed no view: link with a token" }
          $link = $Matches[1]
          $bare = $link -replace '\?token=.*$', ''
          Write-Host "page: $bare (token elided)"
          $page = Invoke-WebRequest -Uri $link -UseBasicParsing -ErrorAction Stop
          if ($page.StatusCode -ne 200) { Fail "the link with its token answered $($page.StatusCode), not 200" }
          $status = $null
          try { $status = [int](Invoke-WebRequest -Uri $bare -UseBasicParsing -ErrorAction Stop).StatusCode }
          catch {
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            else { Fail "the page without its token: $($_.Exception.Message)" }
          }
          if ($status -ne 403) { Fail "the page without its token answered $status, not 403" }
          Write-Host "with the token: 200; without it: 403"

      # 6. A state folder named with accents and a non-Latin script, as %LOCALAPPDATA% is under a user folder such
      # as C:\Users\José: the server keeps its data (the page token) there, and a model builds through it. The
      # folder's name stays out of the scripts' text: Windows PowerShell 5.1 reads a script without a byte-order
      # mark as ANSI.
      - name: cad server start and cad run, with an accented, non-Latin state folder (5.1)
        shell: powershell
        timeout-minutes: 20
        env:
          CAD_STATE_DIR: ${{ runner.temp }}\état-José-日本
        run: |
          . "$env:RUNNER_TEMP\e2e.ps1"
          $r = Invoke-Cad server stop
          if ($r.Code) { Fail "cad server stop exited $($r.Code)" }
          $r = Invoke-Cad server start
          Need $r 'cad server start, accented state folder' @("cad $([regex]::Escape($env:CAD_RELEASE))")
          $dir = Join-Path $env:RUNNER_TEMP 'models\accented'
          Save "$dir\box.py" @'
          from cad import model


          @model
          def box():
              import build123d as bd

              return bd.Box(40, 20, 6)


          if __name__ == "__main__":
              box()
          '@
          Set-Location $dir
          $r = Invoke-Cad run box.py
          Need $r 'cad run box.py, accented state folder' @('(?m)^(built|took) \S+', 'bounds 40\D+20\D+6 mm')
          if (-not (Test-Path -LiteralPath (Join-Path $env:CAD_STATE_DIR 'engines\token'))) {
            Fail "the server kept nothing in the accented state folder"
          }
          $r = Invoke-Cad server stop
          if ($r.Code) { Fail "cad server stop exited $($r.Code)" }

      - name: The engine's state, on a failure
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          if ($env:CAD_CMD -and (Test-Path $env:CAD_CMD)) {
            & $env:CAD_CMD server status
            & $env:CAD_CMD doctor
          }

      # Removing cad is uv's: `uv tool uninstall cad`, once its server is stopped.
      - name: uv tool uninstall cad
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:CAD_CMD) { & $env:CAD_CMD server stop }
          $uv = (Get-Command uv -ErrorAction SilentlyContinue).Source
          if (-not $uv) { $uv = Join-Path $env:USERPROFILE '.local\bin\uv.exe' }
          & $uv tool uninstall cad
          if ($LASTEXITCODE) { throw "uv tool uninstall cad exited $LASTEXITCODE" }
          if (Test-Path $env:CAD_CMD) { throw "cad.exe is still there after uv tool uninstall cad: $env:CAD_CMD" }
          Write-Host "cad.exe is gone"
