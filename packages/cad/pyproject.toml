[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cad"
version = "0.11.3"
description = "CAD models as Python: the library a model imports, built into documents (.xbf) and the STEP, GLB, STL, 3MF and DXF they declare, with the CAD kernel as its build123d extra."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "earthtojake" }]
keywords = ["cad", "step", "glb", "build123d", "parametric", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
# Two sets. The required dependencies are what the server imports of the library -- the document
# model, the protocol a client speaks, the build's words -- none of which imports the CAD kernel (a
# test holds that): numpy alone, the meshes' arrays. The `build123d` extra is what a model runs on: the
# server installs `cad[build123d]` at its own release into the one environment every worker starts
# from (the base), and a person who installs the library by hand to run models installs
# `cad[build123d]`.
dependencies = [
  # The library's meshes are numpy arrays end to end: the engine packs each part's triangles into
  # its wire format, and the STL/3MF/GLB writers read them back. The server's own process reads the
  # wire format's buffers too, so numpy is required. build123d requires numpy 2 already; the library
  # names the same range because it imports numpy itself.
  "numpy>=2,<3",
]

[project.optional-dependencies]
# The build123d integration's extra, named for its technology: the CAD kernel and what the library's
# kernel processes import beside it. shapely is kept DIRECT on purpose though it looks transitive
# through build123d: the library imports it itself -- flatten's unions and offsets are OCC operations
# now, with shapely only the fallback for the degenerate unions OCC refuses -- and a fallback that is
# not installed is not a fallback.
build123d = [
  "bd_materials>=0.2.5,<0.3",
  "threejs-materials>=1.2.5,<1.3",
  # Bounded above on purpose. The library does not merely CALL build123d, it reaches into it: the
  # engine's determinism settings shadow `set` in its topology modules and replace
  # `Vertex.__hash__`, and its memo wraps the kernel's constructors and reads their arguments BY
  # POSITION. A minor release is free to reorder those signatures or rename those choke points, and
  # the failure mode is silent: a patch that no longer matches simply stops applying. Raise the
  # ceiling deliberately, after re-running the suite against the new minor.
  "build123d>=0.13.0,<0.14",
  # The library imports OCP directly for STEP/XCAF, topology and BREP work. Match build123d's
  # non-VTK provider: the library does not import VTK or cadquery, and this keeps the optional
  # visualization stack out of every CAD install. OCP 8 collection, vector and downcast names are
  # used directly.
  "cadquery-ocp-novtk>=8.0,<8.1",
  # @eng_drawing renders its PDF through ezdxf's drawing add-on, whose matplotlib backend is the page
  # renderer. The add-on also imports Pillow at module level and ezdxf declares neither, so a module
  # of the library would otherwise import packages it does not depend on -- and the drawing IS the
  # PDF, so neither is optional. It runs in model code, where the server cannot know before the run
  # that a script wants it: so it is the kernel's.
  "matplotlib",
  "shapely",
  # The engine's DXF export writes a drawing through build123d's ExportDXF and checks it with ezdxf,
  # and @eng_drawing lays out its sheets in it; the OCCT stills draw their annotation ink and
  # measurements with Pillow. Both run in the kernel's processes.
  "ezdxf",
  "pillow",
  # A stress study (`cad <type> solve`) finds the parts of an assembly that touch with scipy (a KD-tree
  # of sampled faces) in the kernel's process, beside the B-rep it reads. build123d brings it already;
  # it is named here because the library imports it itself.
  "scipy>=1.14,<2",
]
# The kicad integration's extra: kicode, KiCad's headless command line (kicad-cli) and its IPC API client
# (KiPy, as `kicode`) in one package -- what a check, an export and an edit (kicad_pcb.edit) run; a
# person's own KiCad is never run. Pinned exactly: one KiCad nightly's build (kicode-pcb, the board side,
# 55-85 MB a platform, and kicode-sch, the schematic side a BOM reads), whose kicad-cli and KiPy match.
kicad = [
  "kicode==10.99.0.dev20261106",
]
# The netgen integration's extra: a stress study (`cad <type> solve`, cad._internal.fea) meshes a part's own
# faces with netgen (LGPL-2.1, a wheel installed beside the library and imported only by the mesher's own
# process, cad.netgen._mesher, since its OpenCascade and OCP's cannot share one; about 8-11 MB). A study
# reads the document's B-rep with OCP too, so the `cad` command runs it in the environment of
# cad[build123d,netgen,calculix]. Bounded above because the mesher reaches past netgen's entry points into its
# geometry and meshing parameters (OCCGeometry, SecondOrder, curvaturesafety, grading), which a minor
# release is free to change; the accuracy margins were measured at 6.2.2608, the floor. netgen publishes
# wheels for macOS, Linux x86_64 and Windows x86_64 alone, and no sdist, so the extra installs it only
# there: anywhere else (Linux on ARM) it installs nothing and a solve refuses, naming the platform
# (cad._internal.fea.mesh). CalculiX, which solves, is the calculix integration's, below.
netgen = [
  "netgen-mesher>=6.2.2608,<6.3; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]
# The calculix integration's extra: a stress study (`cad <type> solve`) is solved by CalculiX's ccx, which the
# cad-ccx package carries (CalculiX's own program, unmodified, from conda-forge's build, with the libraries it loads:
# 8-13 MB a platform, GPL-2.0 like CalculiX, run as a separate program and never linked). Pinned exactly: the
# release a study's numbers were measured against. A person's own ccx is never run unless CAD_CCX names it.
calculix = [
  "cad-ccx==2.23.0",
]
# The trimesh integration's extra: the manufacturing check measures a 3D document's mesh with trimesh
# (cad.trimesh). Bounded above because the measurements reach past its loaders into its graph, ray and
# subdivision APIs (face adjacency, connected components, subdivide_to_size, intersects_location), which a
# major release is free to change. rtree, scipy and networkx are trimesh's optional extras, and ours are
# not optional: the undercut and wall-thickness ray casts need rtree's index; mesh.split, body_count and
# the connected-component graphs need scipy; and mesh.split's repair of an open body (fill_holes: two
# bodies printed one on the other share a face, so neither is closed) needs networkx -- without them a
# family dies on a ModuleNotFoundError. Meshes are read by the library's own readers (a 3MF and a GLB
# written as an STL first), so trimesh's 3MF loader and lxml, which it alone needs, are not ours.
trimesh = [
  "trimesh>=4.6,<6",
  "rtree>=1.2,<2",
  "scipy>=1.14,<2",
  "networkx>=3.2,<4",
]

[project.urls]
Homepage = "https://github.com/earthtojake/text-to-cad"
Repository = "https://github.com/earthtojake/text-to-cad"
Issues = "https://github.com/earthtojake/text-to-cad/issues"

[tool.pyrefly]
preset = "basic"
project-includes = ["src"]
search-path = ["src"]
# A checkout under an ignored folder (a `.claude/worktrees/...` worktree) would
# otherwise have src excluded by the ignore files above it and check nothing.
use-ignore-files = false
# netgen: imported only by the mesher's own process (`cad/netgen/_mesher.py`), and it ships no type stubs.
# cad_ccx: the calculix extra's, imported where a study looks for the program (`cad/calculix/_program.py`), and the
# package jobs that check types do not install it.
ignore-missing-imports = ["netgen", "netgen.*", "cad_ccx"]

[tool.setuptools.packages.find]
where = ["src"]
# `cad`, the library, and `cadgen`, its earlier name: an alias of it (src/cadgen/__init__.py).
include = ["cad", "cad.*", "cadgen"]

[tool.setuptools.package-data]
cad = ["py.typed", "*.pyi"]
# The engine's look lights the regular display modes with this environment image, which the
# engine serves to the viewer and the OCCT stills read (cad.engine.render.look).
"cad.engine.render" = ["studio.hdr"]
