# The distribution named cadgen, the library's deprecated alias, still published so a project that declares it
# resolves: the text-to-cad library, cad, at this very release, and nothing of its own (no
# module, no command; cad carries the `cadgen` import name). Released with every release.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cadgen"
version = "0.11.3"
description = "Deprecated alias of the text-to-cad library, still published: installs cad at the same release. Import cad."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "earthtojake" }]
dependencies = ["cad==0.11.3"]

[project.optional-dependencies]
# `cadgen[build123d]`: the library's own build123d extra. `cadgen[kernel]` is its 0.8 spelling, the way 0.8
# installed the CAD kernel by hand, kept: the same stack.
build123d = ["cad[build123d]==0.11.3"]
kernel = ["cad[build123d]==0.11.3"]

[project.urls]
Homepage = "https://github.com/earthtojake/text-to-cad"

[tool.setuptools]
packages = []
