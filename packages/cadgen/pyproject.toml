[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cadgen"
version = "0.8.4"
description = "CAD models as Python, built by a warm engine into documents (.xbf) and the STEP, GLB, STL, 3MF and DXF they declare, with the CAD Viewer and the tools that show and check them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "earthtojake" }]
keywords = ["cad", "step", "glb", "build123d", "parametric", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
# Two sets. The required dependencies are the core: the engine's server, the `cadgen` command, the
# CAD Viewer's server and the MCP shim, none of which imports the CAD kernel (a test holds that).
# The `kernel` extra is what a model runs on: the engine installs `cadgen[kernel]` at its own
# release into the one environment every worker starts from (cadgen/_internal/base.py), and a
# person who installs cadgen by hand to run models installs `cadgen[kernel]`.
dependencies = [
  # The engine makes the environment its workers run in, and each project's that declares
  # packages, with uv: a dependency, so it is always there (its wheel carries the binary,
  # `uv.find_uv_bin`), on a machine with no uv on PATH too.
  "uv>=0.7",
  # cadgen's meshes are numpy arrays end to end: the engine packs each part's
  # triangles into its wire format, and the STL/3MF/GLB writers read them back
  # (engine/mesh.py, engine/export/). The server's own process reads the wire
  # format's buffers too, so numpy is the core's. build123d requires numpy 2
  # already; cadgen names the same range because it imports numpy itself.
  "numpy>=2,<3",
  # ezdxf is not an author-facing contract: the engine writes a DXF through
  # build123d's ExportDXF. cadgen reads one with it, though: cadgen.drawing_payload
  # flattens a .dxf for the Viewer's pane in the server's own process, the engine's
  # DXF export checks the drawing it wrote, and @eng_drawing lays out its sheets in
  # it. Dropping the declaration would leave those resting on build123d's own
  # dependency list, and they would fail at a user's runtime, not at install, the
  # day that list changes.
  "ezdxf",
  # The DXF pane's raster and the engine's stills (annotation ink, measurements)
  # are drawn with Pillow.
  "pillow",
]

[project.optional-dependencies]
# The CAD kernel and what cadgen's kernel processes import beside it. shapely is kept
# DIRECT on purpose though it looks transitive through build123d: cadgen imports it
# itself -- flatten's unions and offsets are OCC operations now, with shapely only the
# fallback for the degenerate unions OCC refuses -- and a fallback that is not
# installed is not a fallback.
kernel = [
  "bd_materials>=0.2.5,<0.3",
  "threejs-materials>=1.2.5,<1.3",
  # Bounded above on purpose. cadgen does not merely CALL build123d, it
  # reaches into it: the engine's determinism settings shadow `set` in its
  # topology modules and replace `Vertex.__hash__`, and its memo wraps the
  # kernel's constructors and reads their arguments BY POSITION. A minor release
  # is free to reorder those signatures or rename those choke points, and the
  # failure mode is silent: a patch that no longer matches simply stops
  # applying. Raise the ceiling deliberately, after re-running the suite
  # against the new minor.
  "build123d>=0.13.0,<0.14",
  # cadgen imports OCP directly for STEP/XCAF, topology and BREP work.  Match
  # build123d's non-VTK provider: cadgen does not import VTK or cadquery, and
  # this keeps the optional visualization stack out of every CAD install.
  # OCP 8 collection, vector and downcast names are used directly.
  "cadquery-ocp-novtk>=8.0,<8.1",
  # @eng_drawing renders its PDF through ezdxf's drawing add-on, whose
  # matplotlib backend is the page renderer. The add-on also imports Pillow at
  # module level and ezdxf declares neither, so a cadgen module would otherwise
  # import packages cadgen does not depend on -- and the drawing IS the PDF, so
  # neither is optional. It runs in model code, where the engine cannot know
  # before the run that a script wants it: so it is the kernel's.
  "matplotlib",
  "shapely",
]

[project.urls]
Homepage = "https://github.com/earthtojake/text-to-cad"
Repository = "https://github.com/earthtojake/text-to-cad"
Issues = "https://github.com/earthtojake/text-to-cad/issues"

[project.scripts]
cadgen = "cadgen.cli:main"

[tool.pyrefly]
preset = "basic"
project-includes = ["src"]
search-path = ["src"]
# A checkout under an ignored folder (a `.claude/worktrees/...` worktree) would
# otherwise have src excluded by the ignore files above it and check nothing.
use-ignore-files = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cadgen*", "cad_mcp*"]

[tool.setuptools.package-data]
# _runtime holds what cadgen serves that is not Python: the CAD Viewer's built client that
# `cadgen viewer` serves and the CAD app page `cadgen mcp` serves. It is data, not a
# subpackage (no __init__), and it is found at call time by cadgen.assets.
# Verified by scripts/release/check-wheel-contents.sh.
cadgen = ["py.typed", "*.pyi", "_runtime/**/*"]
# The viewer server's catalog ordering is ICU root collation, read from this table at
# runtime; it ships beside the code that reads it.
"cadgen.viewer" = ["collation.json"]
# The engine's README is the mechanisms its laws constrain, and the page `cadgen serve` shows a
# document in (cadgen.engine.serve reads it beside itself).
"cadgen.engine" = ["README.md", "page/*"]
# The engine's look lights the regular display modes with this environment image, which the
# engine serves to the viewer and the OCCT stills read (cadgen.engine.render.look).
"cadgen.engine.render" = ["studio.hdr"]
