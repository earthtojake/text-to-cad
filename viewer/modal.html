<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modal Vibration — CAD Viewer</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0e1116; color: #e6edf3;
        font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #panel { position: absolute; top: 12px; left: 12px; width: 280px; padding: 14px 14px 16px;
        background: rgba(20,24,31,0.92); border: 1px solid #2a313c; border-radius: 12px;
        backdrop-filter: blur(8px); box-shadow: 0 8px 30px rgba(0,0,0,0.4); }
      #panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .2px; }
      #panel .sub { color: #9aa7b4; font-size: 11.5px; margin-bottom: 10px; }
      .seg { display: flex; gap: 6px; margin-bottom: 12px; }
      .seg button { flex: 1; padding: 7px 8px; border-radius: 8px; border: 1px solid #2f3744;
        background: #161b22; color: #c9d4df; cursor: pointer; font-size: 12px; }
      .seg button[aria-pressed="true"] { background: #2563eb; border-color: #2563eb; color: #fff; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0; }
      .row label { color: #9aa7b4; }
      input[type=range] { width: 150px; accent-color: #2563eb; }
      select, button.action { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid #2f3744;
        background: #161b22; color: #e6edf3; font-size: 12px; }
      button.action { cursor: pointer; margin-top: 6px; }
      #modes { margin: 8px 0 4px; max-height: 168px; overflow:auto; }
      #modes .mode { display:flex; justify-content:space-between; padding: 5px 8px; border-radius: 7px;
        cursor: pointer; border: 1px solid transparent; }
      #modes .mode:hover { background: #161b22; }
      #modes .mode[aria-current="true"] { background: #11203a; border-color:#2563eb; }
      #modes .freq { color:#7fd1ff; font-variant-numeric: tabular-nums; }
      #hint { color:#9aa7b4; font-size: 11.5px; margin-top: 10px; border-top:1px solid #232a33; padding-top:10px; }
      #status { position:absolute; bottom:12px; left:12px; color:#7f8c9a; font-size:11.5px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="panel">
      <h1>Modal vibration</h1>
      <div class="sub" id="title">loading…</div>

      <div class="seg" role="group" aria-label="interaction mode">
        <button id="mode-pluck" aria-pressed="true">Pluck (drag)</button>
        <button id="mode-play" aria-pressed="false">Play mode</button>
      </div>

      <div id="modes"></div>

      <div class="row"><label for="slowdown">Slow‑mo ×<span id="slowval"></span></label>
        <input id="slowdown" type="range" min="1" max="2000" step="1" /></div>
      <div class="row"><label for="damping">Damping ζ <span id="dampval"></span></label>
        <input id="damping" type="range" min="0" max="0.2" step="0.001" /></div>

      <button class="action" id="reset">Reset</button>
      <div id="hint"></div>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/client/modal/modalDemo.js"></script>
  </body>
</html>
