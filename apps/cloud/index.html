<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page lives at /b/<build>/<path>; its assets, workers and the drawing editor's fonts are at the root. -->
    <base href="/" />
    <meta name="description" content="A CAD build, in the CAD viewer." />
    <title>CAD</title>
    <!--cloud:og-->
    <script>
      // First paint in the tab's appearance, read where the app reads it: this tab's record in
      // sessionStorage (`web/host/tabRecord.ts`). A new tab has none and follows the OS.
      (function () {
        const root = document.documentElement;
        const known = (value) => value === "light" || value === "dark" || value === "system";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        let preference = "system";
        try {
          const record = JSON.parse(window.sessionStorage.getItem("text-to-cad:cloud-tab:v1") || "null");
          const stored = record && record.settings ? record.settings.appearance : "system";
          preference = known(stored) ? stored : "system";
        } catch {
          preference = "system";
        }
        const mode = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        root.classList.toggle("dark", mode === "dark");
        root.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
