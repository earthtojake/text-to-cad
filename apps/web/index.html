<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse cached CAD parts, assemblies, and prompt-ready references" />
    <title>text-to-cad</title>
    <script>
      // First paint in the stored appearance, read as colorScheme.js reads it: the cookie
      // (shared by every viewer port on this host) wins, then this origin's localStorage.
      (function () {
        const root = document.documentElement;
        const known = (value) => value === "light" || value === "dark" || value === "system";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        let preference = "system";
        try {
          const cookie = document.cookie.split(";").map((part) => part.trim().split("=")).find(([name]) => name === "cad-viewer-appearance");
          const cookiePreference = cookie ? cookie.slice(1).join("=") : "";
          const storedPreference = window.localStorage && window.localStorage.getItem("cad-viewer:color-scheme");
          preference = known(cookiePreference) ? cookiePreference : known(storedPreference) ? storedPreference : "system";
        } catch {
          preference = "system";
        }
        const mode = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        root.classList.toggle("dark", mode === "dark");
        root.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
