<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse cached CAD parts, assemblies, and prompt-ready references" />
    <title>CAD</title>
    <script>
      // First paint in the tab's appearance, read where the app reads it: the tab record in this
      // tab's sessionStorage (`src/persistence/tabRecord.ts`, key and shape shared with it). A new
      // tab has none and follows the OS.
      (function () {
        const root = document.documentElement;
        const known = (value) => value === "light" || value === "dark" || value === "system";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        let preference = "system";
        try {
          const record = JSON.parse(window.sessionStorage.getItem("text-to-cad:tab:v1") || "null");
          const stored = record && record.version === 1 && record.settings ? record.settings.appearance : "system";
          preference = known(stored) ? stored : "system";
        } catch {
          preference = "system";
        }
        const mode = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        root.classList.toggle("dark", mode === "dark");
        root.style.colorScheme = mode;
      })();
    </script>
    <script>
      // First paint in the person's language, read the same way `src/client/ui/locale.js` reads
      // it: a kept choice wins — English included, so "en" is never a sentinel for "ask the
      // browser" — and only an absent choice falls to the browser's languages, else English.
      // The page ships as `lang="en"`; this names the document before any string is on screen,
      // and `main.tsx` runs the app in the same answer.
      (function () {
        const known = ["en", "zh-CN"];
        const preferred = (stored) => {
          const wanted = String(stored || "").trim().toLowerCase();
          return known.find((id) => id.toLowerCase() === wanted)
            || known.find((id) => id.toLowerCase().split("-")[0] === wanted.split(/[-_]/)[0]);
        };
        let kept;
        try {
          kept = preferred(window.localStorage.getItem("text-to-cad:locale:v1"));
        } catch {
          kept = undefined;
        }
        let locale = kept;
        if (!locale) {
          for (const language of window.navigator.languages || [window.navigator.language]) {
            const found = preferred(language);
            if (found) { locale = found; break; }
          }
        }
        document.documentElement.lang = locale || "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
