<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse cached CAD parts, assemblies, and prompt-ready references" />
    <title>CAD</title>
    <script>
      // First paint in the tab's appearance, read where the app reads it: the tab record in this
      // tab's sessionStorage (`src/persistence/tabRecord.ts`, key and shape shared with it). A new
      // tab has none and follows the OS.
      (function () {
        const root = document.documentElement;
        const known = (value) => value === "light" || value === "dark" || value === "system";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        let preference = "system";
        try {
          const record = JSON.parse(window.sessionStorage.getItem("text-to-cad:tab:v1") || "null");
          const stored = record && record.version === 1 && record.settings ? record.settings.appearance : "system";
          preference = known(stored) ? stored : "system";
        } catch {
          preference = "system";
        }
        const mode = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
        root.classList.toggle("dark", mode === "dark");
        root.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
