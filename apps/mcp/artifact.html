    <style>
      /* The page before the engine's app takes it over: what it is waiting for, or how to connect it. */
      :root { color-scheme: light dark; }
      :root[data-theme=light] { color-scheme: light; }
      :root[data-theme=dark] { color-scheme: dark; }
      html, body, #root { height: 100%; margin: 0; }
      .cad-artifact { box-sizing: border-box; min-height: 100%; display: flex; align-items: center; justify-content: center;
        padding: clamp(20px, 5vw, 56px) max(5vw, 16px); background: light-dark(#fff, #141414); color: light-dark(#141414, #ececec);
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
      .cad-artifact * { box-sizing: border-box; min-width: 0; }
      .cad-artifact-body { width: 100%; max-width: 34rem; display: flex; flex-direction: column; gap: 14px; }
      .cad-artifact h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; text-wrap: balance; }
      .cad-artifact p, .cad-artifact ol { margin: 0; }
      .cad-artifact ol { padding-inline-start: 1.3em; display: flex; flex-direction: column; gap: 10px; }
      .cad-artifact .muted { color: light-dark(#5b5b5b, #a3a3a3); }
      .cad-artifact code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
      .cad-artifact pre { margin: 6px 0 0; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
        background: light-dark(#f4f4f4, #1f1f1f); border: 1px solid light-dark(#e3e3e3, #2c2c2c); }
      .cad-artifact a { color: inherit; }
      .cad-artifact button { font: 500 13px/1 system-ui, sans-serif; padding: 9px 14px; min-height: 36px; border-radius: 6px; cursor: pointer;
        border: 1px solid light-dark(#d4d4d4, #3a3a3a); background: light-dark(#fff, #1f1f1f); color: inherit; }
      .cad-artifact button:focus-visible { outline: 2px solid light-dark(#2563eb, #60a5fa); outline-offset: 2px; }
      .cad-artifact textarea { width: 100%; min-height: 9rem; padding: 10px; border-radius: 8px; font: 13px/1.5 ui-monospace, monospace;
        background: light-dark(#f4f4f4, #1f1f1f); color: inherit; border: 1px solid light-dark(#e3e3e3, #2c2c2c); }
      .cad-artifact-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .cad-artifact-copied { position: fixed; inset: auto 16px 16px auto; z-index: 100; max-width: min(28rem, calc(100vw - 32px));
        padding: 10px 14px; border-radius: 8px; background: light-dark(#141414, #ececec); color: light-dark(#fff, #141414);
        font: 13px/1.4 system-ui, sans-serif; box-shadow: 0 6px 24px rgb(0 0 0 / .18); }
      .cad-artifact-pill { position: fixed; right: 16px; bottom: 16px; z-index: 90; padding: 9px 14px; min-height: 36px; border-radius: 999px; cursor: pointer;
        font: 500 13px/1 system-ui, sans-serif; border: 1px solid light-dark(#d4d4d4, #3a3a3a); background: light-dark(#fff, #1f1f1f);
        color: light-dark(#141414, #ececec); box-shadow: 0 4px 16px rgb(0 0 0 / .12); }
      .cad-artifact-pill:focus-visible { outline: 2px solid light-dark(#2563eb, #60a5fa); outline-offset: 2px; }
      .cad-artifact-dialog { position: fixed; inset: 0; z-index: 100; background: rgb(0 0 0 / .35); }
      .cad-artifact-dialog > .cad-artifact { min-height: 0; height: auto; margin: 10vh auto 0; max-width: 36rem; border-radius: 12px; }
    </style>

    <div id="root">
