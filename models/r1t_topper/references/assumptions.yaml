schema_version: 1
checkpoint: 1
units: mm
coordinate_system:
  x: vehicle length, positive rearward
  y: vehicle width, positive driver side
  z: vertical, positive upward
  origin: vehicle centerline at forward edge of bed-rail mounting plane
provenance_policy:
  - MEASURED
  - MANUFACTURER REFERENCE
  - ESTIMATED
  - DESIGN DECISION
  - PLACEHOLDER REQUIRING SCAN
current_state:
  measured_values: 0
  manufacturer_reference_values: 0
  warning: No Checkpoint 1 vehicle dimension is dimensionally trustworthy yet.
high_risk_assumptions:
  - bed rail outer width and section geometry
  - cab rear roof height, width, curvature, and surface angle
  - tailgate and rear-light motion/clearance envelopes
  - factory bed anchor locations and interface geometry
  - factory crossbar mount locations and interface geometry
  - bed control locations and service keep-outs
geometry_scope:
  included:
    - simplified bed floor and rail envelopes
    - simplified cab rear and roof trailing plane
    - pickup tailgate below the topper opening plane
    - factory anchor and control keep-out placeholders
    - two cab and two topper transverse crossbar references
    - visible global coordinate artifact
  excluded:
    - production body surfaces
    - topper exterior and structure
    - hatch kinematics
    - proprietary Rivian interface geometry
    - structural validation
